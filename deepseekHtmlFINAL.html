<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherOS — Ultimate</title>
    <style>
        /* ----- ROOT ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        :root {
            --bg: #0a0a18;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #eee;
            --accent: #7c6cf0;
            --accent-glow: 0 0 30px rgba(124, 108, 240, 0.4);
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --taskbar-height: 60px;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        #desktop {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: var(--bg);
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 16px 20px;
            overflow-y: auto;
            transition: background-image 0.6s ease;
        }
        #desktop::before {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(2px);
            pointer-events: none;
            background: radial-gradient(circle at 20% 30%, rgba(124, 108, 240, 0.05), transparent 60%);
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 98px;
            cursor: grab;
            border-radius: var(--radius);
            padding: 6px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1), background 0.3s, border-color 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 1;
        }
        .app-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
            transform: translateY(-3px);
        }
        .app-icon:active {
            transform: scale(0.92);
            cursor: grabbing;
        }
        .app-icon.dragging {
            opacity: 0.3;
            border: 2px dashed #fff;
        }
        .app-icon .icon-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .app-icon .icon-emoji {
            font-size: 42px;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .app-icon .app-label {
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 4px;
            text-shadow: 0 1px 10px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 12px;
            border-radius: 30px;
            max-width: 78px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-icon .delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #c42b2b;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }
        .app-icon:hover .delete-btn {
            display: flex;
        }

        .os-window {
            position: absolute;
            min-width: 360px;
            min-height: 220px;
            background: rgba(20, 20, 40, 0.88);
            backdrop-filter: blur(30px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
            animation: winIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            resize: both;
        }
        @keyframes winIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .os-window.maximized {
            width: 100% !important;
            height: calc(100% - var(--taskbar-height)) !important;
            top: 0 !important;
            left: 0 !important;
            border-radius: 0;
            resize: none;
        }
        .os-window .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 55, 0.85);
            padding: 6px 14px;
            cursor: grab;
            flex-shrink: 0;
            border-radius: var(--radius) var(--radius) 0 0;
            min-height: 40px;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }
        .os-window .title-bar:active {
            cursor: grabbing;
        }
        .os-window .title-bar .win-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #eee;
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .os-window .title-bar .win-title img {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }
        .os-window .title-bar .win-controls {
            display: flex;
            gap: 4px;
        }
        .os-window .title-bar .win-controls button {
            background: none;
            border: none;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            padding: 0 8px;
            border-radius: 8px;
            line-height: 1.2;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .os-window .title-bar .win-controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .os-window .title-bar .win-controls .close-btn:hover {
            background: #c42b2b;
        }
        .os-window .title-bar .win-controls .max-btn:hover {
            background: #2a8a5a;
        }
        .os-window .title-bar .win-controls .min-btn:hover {
            background: #4a4a7a;
        }
        .os-window .title-bar .win-controls .tab-btn:hover {
            background: #6a4a8a;
        }
        .os-window .title-bar .win-controls .blank-btn:hover {
            background: #4a6a8a;
        }
        .os-window .win-content {
            flex: 1;
            background: rgba(12, 12, 26, 0.5);
            overflow: auto;
            padding: 10px;
            color: #eee;
            position: relative;
        }
        .os-window .win-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            border-radius: 8px;
        }
        .os-window .win-content .internal-app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #taskbar {
            height: var(--taskbar-height);
            background: rgba(10, 10, 24, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            flex-shrink: 0;
            z-index: 999;
        }
        #taskbar .start-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 0 30px rgba(124, 108, 240, 0.3);
        }
        #taskbar .start-btn:hover {
            background: #8a7aff;
            transform: scale(1.03);
        }
        #taskbar .task-items {
            display: flex;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            align-items: center;
        }
        #taskbar .task-items .task-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            color: #ddd;
            padding: 4px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #taskbar .task-items .task-btn:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        #taskbar .task-items .task-btn.active {
            border-color: var(--accent);
            background: rgba(124, 108, 240, 0.15);
        }
        #taskbar .task-items .task-btn.minimized {
            opacity: 0.5;
        }
        #taskbar .right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        #taskbar .right #clock {
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            font-size: 14px;
        }

        #start-menu {
            position: absolute;
            bottom: calc(var(--taskbar-height) + 10px);
            left: 20px;
            width: 400px;
            max-height: 550px;
            background: rgba(16, 16, 34, 0.96);
            backdrop-filter: blur(40px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            padding: 18px 14px;
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
        }
        #start-menu.show {
            display: flex;
        }
        #start-menu .start-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            color: #eee;
            font-size: 14px;
            width: calc(50% - 6px);
        }
        #start-menu .start-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }
        #start-menu .start-item img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }
        #start-menu .start-item span {
            font-size: 26px;
        }

        /* ----- INTERNAL APP STYLES (unchanged) ----- */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .calc-grid button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #fff;
            font-size: 24px;
            padding: 14px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.08s;
        }
        .calc-grid button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .calc-grid .op {
            background: rgba(124, 108, 240, 0.25);
        }
        .calc-grid .eq {
            background: rgba(42, 200, 80, 0.4);
        }
        .calc-grid .clear {
            background: rgba(200, 50, 50, 0.3);
        }
        .calc-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 32px;
            text-align: right;
            font-family: monospace;
            min-height: 60px;
            border: 1px solid var(--glass-border);
        }
        .notepad-area {
            width: 100%;
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            color: #eee;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            font-family: monospace;
        }
        .notepad-area:focus {
            outline: none;
            border-color: var(--accent);
        }
        .notepad-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .notepad-toolbar button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #eee;
            padding: 6px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.1s;
        }
        .notepad-toolbar button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
        }
        .settings-row label {
            min-width: 100px;
            color: #aaa;
            font-weight: 500;
        }
        .settings-row input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: none;
        }
        .settings-row input[type="file"] {
            color: #aaa;
        }
        .settings-row .wallpaper-gallery {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-row .wallpaper-gallery .wall-thumb {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
        }
        .settings-row .wallpaper-gallery .wall-thumb:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .settings-row .wallpaper-gallery .wall-thumb.active {
            border-color: #fff;
        }
        .proxy-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .proxy-bar input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px 18px;
            color: #fff;
            font-size: 14px;
            min-width: 150px;
        }
        .proxy-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .proxy-bar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
        }
        .proxy-bar button:hover {
            background: #8a7aff;
        }
        .proxy-frame {
            flex: 1;
            background: #fff;
            border: none;
            border-radius: 10px;
            min-height: 300px;
        }
        .aetherflix-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #141414;
            overflow: hidden;
            position: relative;
            color: #fff;
        }
        .aetherflix-wrapper .netflix-nav {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            position: relative;
            z-index: 10;
            gap: 20px;
            flex-shrink: 0;
        }
        .aetherflix-wrapper .netflix-nav .brand {
            font-size: 28px;
            font-weight: 900;
            color: #e50914;
            letter-spacing: 2px;
        }
        .aetherflix-wrapper .netflix-nav .nav-links {
            display: flex;
            gap: 16px;
            flex: 1;
        }
        .aetherflix-wrapper .netflix-nav .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.15s;
            cursor: pointer;
        }
        .aetherflix-wrapper .netflix-nav .nav-links a:hover {
            color: #fff;
        }
        .aetherflix-wrapper .netflix-content {
            flex: 1;
            overflow: hidden;
            background: #141414;
            position: relative;
        }
        .aetherflix-wrapper .netflix-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0a0a18;
            overflow: hidden;
            position: relative;
        }
        .game-wrapper .game-toolbar {
            display: flex;
            gap: 8px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
            z-index: 5;
            position: relative;
            align-items: center;
        }
        .game-wrapper .game-toolbar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.15s;
        }
        .game-wrapper .game-toolbar button:hover {
            background: #8a7aff;
        }
        .game-wrapper .game-toolbar .alt-btn {
            background: #e50914;
        }
        .game-wrapper .game-toolbar .alt-btn:hover {
            background: #f40612;
        }
        .game-wrapper .game-toolbar .info {
            color: #aaa;
            font-size: 12px;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-frame {
            flex: 1;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .game-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .terminal-lines {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .terminal-lines .prompt {
            color: #8aff8a;
        }
        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .terminal-input-line .prompt {
            color: #8aff8a;
        }
        .terminal-input-line input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        .music-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            height: 100%;
            padding: 20px;
        }
        .music-player .cover {
            width: 140px;
            height: 140px;
            background: var(--accent);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 0 0 40px rgba(124, 108, 240, 0.3);
        }
        .music-player .controls {
            display: flex;
            gap: 24px;
        }
        .music-player .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #fff;
            font-size: 30px;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.15s;
        }
        .music-player .controls button:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .appstore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .appstore-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .appstore-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .appstore-item .app-icon-big {
            font-size: 48px;
        }
        .appstore-item .app-name {
            font-weight: 500;
            font-size: 14px;
            text-align: center;
        }
        .appstore-item .app-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 4px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.1s;
        }
        .appstore-item .app-btn:hover {
            background: #8a7aff;
        }
        .explorer-tree {
            display: flex;
            gap: 12px;
            height: 100%;
        }
        .explorer-sidebar {
            width: 160px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .explorer-sidebar .folder-item {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .explorer-sidebar .folder-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .explorer-main {
            flex: 1;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 8px;
            overflow-y: auto;
        }
        .explorer-main .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: default;
        }
        .explorer-main .file-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .weather-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px;
        }
        .weather-display .temp {
            font-size: 48px;
            font-weight: 200;
        }
        .weather-display .desc {
            font-size: 20px;
            color: #aaa;
        }
        .sysinfo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .sysinfo-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 14px;
        }
        .sysinfo-card .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
        .sysinfo-card .value {
            font-size: 18px;
            font-weight: 500;
            margin-top: 4px;
        }
        .toast-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
        }
        .toast {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
        }
        .toast .toast-title {
            font-weight: 600;
            color: #fff;
        }
        .toast .toast-msg {
            color: #aaa;
            font-size: 13px;
        }
        @keyframes slideIn {
            from {
                transform: translateX(40px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .recycle-bin-icon {
            font-size: 42px;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .custom-app-form {
            background: rgba(0, 0, 0, 0.5);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: auto;
            width: 100%;
        }
        .custom-app-form input,
        .custom-app-form select,
        .custom-app-form textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px 16px;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }
        .custom-app-form textarea {
            border-radius: 12px;
            min-height: 80px;
            resize: vertical;
            font-family: monospace;
        }
        .custom-app-form input:focus,
        .custom-app-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .custom-app-form button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
        }
        .custom-app-form button:hover {
            background: #8a7aff;
        }
        .custom-app-form .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .custom-app-form .row * {
            flex: 1;
        }

        @media (max-width: 640px) {
            #start-menu {
                width: calc(100% - 32px);
                left: 16px;
            }
            .os-window {
                width: 92% !important;
                left: 4% !important;
                min-width: unset;
            }
            .settings-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div id="desktop"></div>
    <div id="start-menu"></div>
    <div id="taskbar">
        <button class="start-btn" id="startBtn">✦ Start</button>
        <div class="task-items" id="taskItems"></div>
        <div class="right">
            <span id="clock">00:00:00</span>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (() => {
            'use strict';

            // ---------- CORE CONFIG ----------
            // Built‑in apps (fallback if apps.json not loaded)
            const BUILTIN_APPS = [
                { id: 'calc', name: 'Calculator', icon: '🧮', type: 'internal', internal: 'calculator' },
                { id: 'notepad', name: 'Notepad', icon: '📝', type: 'internal', internal: 'notepad' },
                { id: 'settings', name: 'Settings', icon: '⚙️', type: 'internal', internal: 'settings' },
                { id: 'proxy', name: 'Web Proxy', icon: '🌐', type: 'internal', internal: 'proxy' },
                { id: 'terminal', name: 'Terminal', icon: '⌨️', type: 'internal', internal: 'terminal' },
                { id: 'music', name: 'Music Player', icon: '🎵', type: 'internal', internal: 'music' },
                { id: 'appstore', name: 'App Store', icon: '📦', type: 'internal', internal: 'appstore' },
                { id: 'explorer', name: 'File Explorer', icon: '📁', type: 'internal', internal: 'explorer' },
                { id: 'weather', name: 'Weather', icon: '🌤️', type: 'internal', internal: 'weather' },
                { id: 'sysinfo', name: 'System Info', icon: '💻', type: 'internal', internal: 'sysinfo' },
                { id: 'aetherflix', name: 'AetherFlix', icon: '🎬', type: 'internal', internal: 'aetherflix' },
                { id: 'blooket', name: 'Blooket (Hacks)', icon: '📚', type: 'internal', internal: 'blooket' },
                { id: 'kahoot', name: 'Kahoot (Hacks)', icon: '🎯', type: 'internal', internal: 'kahoot' },
                { id: 'gimkit', name: 'Gimkit (Hacks)', icon: '⚡', type: 'internal', internal: 'gimkit' },
                { id: 'roblox', name: 'Roblox (now.gg)', icon: '🎮', type: 'internal', internal: 'roblox' },
                { id: 'xcloud', name: 'Xbox Cloud Gaming', icon: '🟢', type: 'internal', internal: 'xcloud' }
            ];

            // ---------- STATE ----------
            let allApps = [];
            let appOrder = [];
            let openWindows = [];
            let zCounter = 100;
            let wallpaperData = null;
            let accentColor = '#7c6cf0';
            let recycleBin = [];

            // ---------- DOM ----------
            const desktop = document.getElementById('desktop');
            const startMenu = document.getElementById('start-menu');
            const startBtn = document.getElementById('startBtn');
            const taskItems = document.getElementById('taskItems');
            const clockEl = document.getElementById('clock');
            const toastContainer = document.getElementById('toastContainer');

            // ---------- STORAGE KEYS ----------
            const STORAGE_ORDER = 'aether_order';
            const STORAGE_WALL = 'aether_wall';
            const STORAGE_NOTEPAD = 'aether_notepad';
            const STORAGE_ACCENT = 'aether_accent';
            const STORAGE_CUSTOM = 'aether_custom_apps';
            const STORAGE_RECYCLE = 'aether_recycle_bin';

            // ---------- LOAD / SAVE FUNCTIONS ----------
            function loadAllApps() {
                // Start with built-in apps
                let base = BUILTIN_APPS.slice();
                // Load custom apps from localStorage
                const customData = localStorage.getItem(STORAGE_CUSTOM);
                if (customData) {
                    try {
                        const custom = JSON.parse(customData);
                        if (Array.isArray(custom)) {
                            base = base.concat(custom);
                        }
                    } catch (_) {}
                }
                // Load recycle bin
                const recycleData = localStorage.getItem(STORAGE_RECYCLE);
                if (recycleData) {
                    try {
                        const r = JSON.parse(recycleData);
                        if (Array.isArray(r)) recycleBin = r;
                    } catch (_) {}
                }
                allApps = base;
                // Ensure appOrder contains only existing IDs
                const savedOrder = localStorage.getItem(STORAGE_ORDER);
                if (savedOrder) {
                    try {
                        const parsed = JSON.parse(savedOrder);
                        if (Array.isArray(parsed) && parsed.length === allApps.length) {
                            appOrder = parsed;
                            return;
                        }
                    } catch (_) {}
                }
                // Default order: all IDs
                appOrder = allApps.map(a => a.id);
                saveOrder();
            }

            function saveAllApps() {
                const customApps = allApps.filter(a => !BUILTIN_APPS.some(b => b.id === a.id));
                localStorage.setItem(STORAGE_CUSTOM, JSON.stringify(customApps));
                localStorage.setItem(STORAGE_RECYCLE, JSON.stringify(recycleBin));
                saveOrder();
            }

            function saveOrder() {
                localStorage.setItem(STORAGE_ORDER, JSON.stringify(appOrder));
            }

            function getAppById(id) {
                return allApps.find(a => a.id === id);
            }

            // ---------- EXTERNAL APP LOADER (apps.json) ----------
            async function loadExternalAppLinks(url) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!Array.isArray(data)) throw new Error('Not an array');
                    // Merge: add new apps, skip duplicates by id
                    let added = 0;
                    data.forEach(app => {
                        if (!getAppById(app.id) && app.id && app.name) {
                            // Ensure it has a type, default to 'external'
                            if (!app.type) app.type = 'external';
                            allApps.push(app);
                            appOrder.push(app.id);
                            added++;
                        }
                    });
                    if (added > 0) {
                        saveAllApps();
                        renderIcons();
                        buildStartMenu();
                        showToast('Apps Loaded', `Added ${added} apps from ${url}`);
                    } else {
                        showToast('Info', 'No new apps found in the file.');
                    }
                } catch (err) {
                    showToast('Error', `Failed to load ${url}: ${err.message}`);
                }
            }

            // ---------- WALLPAPER ----------
            function loadWallpaper() {
                const w = localStorage.getItem(STORAGE_WALL);
                if (w) { wallpaperData = w;
                    applyWallpaper(w); }
            }

            function saveWallpaper() {
                if (wallpaperData) localStorage.setItem(STORAGE_WALL, wallpaperData);
                else localStorage.removeItem(STORAGE_WALL);
            }

            function applyWallpaper(data) {
                if (data) { desktop.style.backgroundImage = `url(${data})`;
                    desktop.style.backgroundColor = 'transparent'; } else { desktop.style.backgroundImage = 'none';
                    desktop.style.backgroundColor = 'var(--bg)'; }
            }

            // ---------- ACCENT ----------
            function loadAccent() {
                const a = localStorage.getItem(STORAGE_ACCENT);
                if (a) { accentColor = a;
                    document.documentElement.style.setProperty('--accent', a); }
            }

            function saveAccent(c) { localStorage.setItem(STORAGE_ACCENT, c); }

            // ---------- TOAST ----------
            function showToast(title, msg, duration = 3000) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${msg}</div>`;
                toastContainer.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300); }, duration);
            }

            // ---------- FAVICON ----------
            function getFaviconUrl(url) {
                try { const u = new URL(url); return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`; } catch (
                _) { return null; }
            }

            // ---------- RENDER ICONS ----------
            function renderIcons() {
                desktop.querySelectorAll('.app-icon').forEach(el => el.remove());
                appOrder.forEach(id => {
                    const def = getAppById(id);
                    if (!def) return;
                    const icon = document.createElement('div');
                    icon.className = 'app-icon';
                    icon.draggable = true;
                    icon.dataset.id = id;
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '✕';
                    delBtn.title = 'Delete app (moves to Recycle Bin)';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm(`Move "${def.name}" to Recycle Bin?`)) {
                            deleteApp(id);
                        }
                    });
                    icon.appendChild(delBtn);
                    const iconContent = def.type === 'internal' ?
                        `<span class="icon-emoji">${def.icon}</span>` :
                        `<img class="icon-img" src="${getFaviconUrl(def.url) || ''}" alt="${def.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="icon-emoji" style="display:none;">${def.icon}</span>`;
                    icon.innerHTML += `${iconContent}<span class="app-label">${def.name}</span>`;
                    icon.addEventListener('dblclick', () => openApp(id));
                    icon.addEventListener('dragstart', dragStart);
                    icon.addEventListener('dragend', dragEnd);
                    icon.addEventListener('dragover', dragOver);
                    icon.addEventListener('drop', drop);
                    desktop.appendChild(icon);
                });

                // Recycle bin icon
                const recycleIcon = document.createElement('div');
                recycleIcon.className = 'app-icon';
                recycleIcon.style.position = 'fixed';
                recycleIcon.style.bottom = '80px';
                recycleIcon.style.right = '20px';
                recycleIcon.style.width = '70px';
                recycleIcon.style.height = '80px';
                recycleIcon.style.background = 'rgba(255,255,255,0.05)';
                recycleIcon.style.border = '1px solid var(--glass-border)';
                recycleIcon.style.cursor = 'pointer';
                recycleIcon.innerHTML = `
                    <span class="recycle-bin-icon">🗑️</span>
                    <span class="app-label" style="font-size:10px;">Recycle Bin</span>
                    ${recycleBin.length > 0 ? `<span style="position:absolute;top:-4px;right:-4px;background:#e50914;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;">${recycleBin.length}</span>` : ''}
                `;
                recycleIcon.addEventListener('click', () => { openRecycleBin(); });
                desktop.appendChild(recycleIcon);
            }

            // ---------- RECYCLE BIN ----------
            function deleteApp(id) {
                const app = getAppById(id);
                if (!app) return;
                const idx = allApps.findIndex(a => a.id === id);
                if (idx !== -1) allApps.splice(idx, 1);
                const orderIdx = appOrder.indexOf(id);
                if (orderIdx !== -1) appOrder.splice(orderIdx, 1);
                recycleBin.push(app);
                saveAllApps();
                renderIcons();
                buildStartMenu();
                showToast('App Deleted', `${app.name} moved to Recycle Bin`);
            }

            function restoreFromRecycle(id) {
                const idx = recycleBin.findIndex(a => a.id === id);
                if (idx === -1) return;
                const app = recycleBin.splice(idx, 1)[0];
                allApps.push(app);
                appOrder.push(app.id);
                saveAllApps();
                renderIcons();
                buildStartMenu();
                showToast('Restored', `${app.name} restored from Recycle Bin`);
            }

            function emptyRecycleBin() {
                if (recycleBin.length === 0) { showToast('Recycle Bin', 'Already empty'); return; }
                recycleBin = [];
                saveAllApps();
                showToast('Recycle Bin', 'Emptied permanently');
            }

            function openRecycleBin() {
                // ... (same as previous, with refresh)
                const id = 'recycle-bin-window';
                const existing = openWindows.find(w => w.id === id);
                if (existing) { existing.winElement.style.zIndex = ++zCounter;
                    existing.winElement.focus(); return; }
                const win = document.createElement('div');
                win.className = 'os-window';
                win.style.zIndex = ++zCounter;
                win.style.width = '500px';
                win.style.height = '400px';
                win.style.left = '100px';
                win.style.top = '100px';
                const titleBar = document.createElement('div');
                titleBar.className = 'title-bar';
                titleBar.innerHTML = `
                    <div class="win-title">🗑️ Recycle Bin</div>
                    <div class="win-controls"><button class="close-btn">✕</button></div>
                `;
                win.appendChild(titleBar);
                const content = document.createElement('div');
                content.className = 'win-content';
                content.style.overflow = 'auto';
                content.style.padding = '16px';
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.style.gap = '8px';
                win.appendChild(content);
                desktop.appendChild(win);

                function refreshRecycleView() {
                    content.innerHTML = '';
                    if (recycleBin.length === 0) {
                        content.innerHTML = '<p style="color:#888;text-align:center;">Recycle Bin is empty.</p>';
                        return;
                    }
                    const list = document.createElement('div');
                    list.style.display = 'flex';
                    list.style.flexDirection = 'column';
                    list.style.gap = '6px';
                    recycleBin.forEach(app => {
                        const row = document.createElement('div');
                        row.style.display = 'flex';
                        row.style.alignItems = 'center';
                        row.style.justifyContent = 'space-between';
                        row.style.background = 'rgba(255,255,255,0.04)';
                        row.style.padding = '6px 12px';
                        row.style.borderRadius = '8px';
                        row.innerHTML = `
                            <span>${app.icon} ${app.name}</span>
                            <div>
                                <button class="restore-btn" style="background:#2a8a5a;border:none;color:#fff;padding:2px 12px;border-radius:20px;cursor:pointer;">Restore</button>
                                <button class="delete-perm-btn" style="background:#c42b2b;border:none;color:#fff;padding:2px 12px;border-radius:20px;cursor:pointer;">Delete Permanently</button>
                            </div>
                        `;
                        row.querySelector('.restore-btn').addEventListener('click', () => {
                            restoreFromRecycle(app.id);
                            refreshRecycleView();
                        });
                        row.querySelector('.delete-perm-btn').addEventListener('click', () => {
                            if (confirm(`Permanently delete "${app.name}"?`)) {
                                const idx = recycleBin.findIndex(a => a.id === app.id);
                                if (idx !== -1) {
                                    recycleBin.splice(idx, 1);
                                    saveAllApps();
                                    refreshRecycleView();
                                    renderIcons();
                                    buildStartMenu();
                                    showToast('Deleted', `${app.name} permanently removed`);
                                }
                            }
                        });
                        list.appendChild(row);
                    });
                    const emptyBtn = document.createElement('button');
                    emptyBtn.textContent = 'Empty Recycle Bin';
                    emptyBtn.style.background = '#c42b2b';
                    emptyBtn.style.border = 'none';
                    emptyBtn.style.color = '#fff';
                    emptyBtn.style.padding = '6px 20px';
                    emptyBtn.style.borderRadius = '30px';
                    emptyBtn.style.cursor = 'pointer';
                    emptyBtn.style.marginTop = '12px';
                    emptyBtn.style.alignSelf = 'center';
                    emptyBtn.addEventListener('click', () => {
                        if (confirm('Empty Recycle Bin permanently?')) {
                            emptyRecycleBin();
                            refreshRecycleView();
                            renderIcons();
                            buildStartMenu();
                        }
                    });
                    content.appendChild(list);
                    content.appendChild(emptyBtn);
                }
                refreshRecycleView();
                titleBar.querySelector('.close-btn').addEventListener('click', () => {
                    win.remove();
                    const idx = openWindows.findIndex(w => w.id === id);
                    if (idx !== -1) openWindows.splice(idx, 1);
                });
                // Drag
                let drag = false,
                    ox, oy;
                titleBar.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = e.clientX - rect.left;
                    oy = e.clientY - rect.top;
                    win.style.zIndex = ++zCounter;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    let left = e.clientX - ox,
                        top = e.clientY - oy;
                    left = Math.max(0, Math.min(left, window.innerWidth - 60));
                    top = Math.max(0, Math.min(top, window.innerHeight - 100));
                    win.style.left = left + 'px';
                    win.style.top = top + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false; });
                win.addEventListener('mousedown', () => { win.style.zIndex = ++zCounter;
                    updateTaskbar(); });
                const entry = { id, winElement: win, appDef: { name: 'Recycle Bin', icon: '🗑️' }, minimized: false };
                openWindows.push(entry);
                updateTaskbar();
            }

            // ---------- DRAG & DROP ----------
            let dragId = null;

            function dragStart(e) {
                const el = e.currentTarget;
                dragId = el.dataset.id;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragId);
            }

            function dragEnd(e) { e.currentTarget.classList.remove('dragging');
                document.querySelectorAll('.app-icon.drag-over').forEach(el => el.classList.remove('drag-over')); }

            function dragOver(e) { e.preventDefault();
                e.dataTransfer.dropEffect = 'move'; const t = e.currentTarget; if (t.classList.contains('app-icon')) t
                    .classList.add('drag-over'); }

            function drop(e) {
                e.preventDefault();
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                const srcId = e.dataTransfer.getData('text/plain');
                const tgtId = target.dataset.id;
                if (!srcId || !tgtId || srcId === tgtId) return;
                const srcIdx = appOrder.indexOf(srcId);
                const tgtIdx = appOrder.indexOf(tgtId);
                if (srcIdx === -1 || tgtIdx === -1) return;
                appOrder.splice(tgtIdx, 0, appOrder.splice(srcIdx, 1)[0]);
                saveOrder();
                renderIcons();
                showToast('Order Updated', `${getAppById(srcId).name} moved`);
            }
            desktop.addEventListener('dragover', e => e.preventDefault());
            desktop.addEventListener('drop', e => e.preventDefault());

            // ---------- START MENU ----------
            function buildStartMenu() {
                startMenu.innerHTML = '';
                // Create Custom App
                const createItem = document.createElement('div');
                createItem.className = 'start-item';
                createItem.style.width = '100%';
                createItem.style.background = 'rgba(124,108,240,0.2)';
                createItem.innerHTML = `<span>➕</span> Create Custom App`;
                createItem.addEventListener('click', () => { startMenu.classList.remove('show');
                    openCustomAppCreator(); });
                startMenu.appendChild(createItem);

                // Import from JSON (apps.json)
                const importItem = document.createElement('div');
                importItem.className = 'start-item';
                importItem.style.width = '100%';
                importItem.style.background = 'rgba(42,200,80,0.2)';
                importItem.innerHTML = `<span>📂</span> Import Apps (JSON)`;
                importItem.addEventListener('click', () => {
                    startMenu.classList.remove('show');
                    const url = prompt('Enter URL of the apps.json file (or leave empty to load from ./apps.json):',
                        'apps.json');
                    if (url !== null) {
                        loadExternalAppLinks(url || 'apps.json');
                    }
                });
                startMenu.appendChild(importItem);

                // Recycle bin
                const recycleItem = document.createElement('div');
                recycleItem.className = 'start-item';
                recycleItem.style.width = '100%';
                recycleItem.style.background = 'rgba(200,50,50,0.2)';
                recycleItem.innerHTML = `<span>🗑️</span> Recycle Bin (${recycleBin.length})`;
                recycleItem.addEventListener('click', () => { startMenu.classList.remove('show');
                    openRecycleBin(); });
                startMenu.appendChild(recycleItem);

                // Separator
                const sep = document.createElement('div');
                sep.style.width = '100%';
                sep.style.height = '2px';
                sep.style.background = 'var(--glass-border)';
                sep.style.margin = '4px 0';
                startMenu.appendChild(sep);

                // Apps list
                appOrder.forEach(id => {
                    const def = getAppById(id);
                    if (!def) return;
                    const item = document.createElement('div');
                    item.className = 'start-item';
                    const iconHtml = def.type === 'internal' ?
                        `<span>${def.icon}</span>` :
                        `<img src="${getFaviconUrl(def.url) || ''}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none;">${def.icon}</span>`;
                    item.innerHTML = `${iconHtml} ${def.name}`;
                    item.addEventListener('click', () => { openApp(def.id);
                        startMenu.classList.remove('show'); });
                    startMenu.appendChild(item);
                });
            }

            // ---------- CUSTOM APP CREATOR ----------
            function openCustomAppCreator() {
                const win = document.createElement('div');
                win.className = 'os-window';
                win.style.zIndex = ++zCounter;
                win.style.width = '480px';
                win.style.height = '440px';
                win.style.left = '150px';
                win.style.top = '100px';
                const titleBar = document.createElement('div');
                titleBar.className = 'title-bar';
                titleBar.innerHTML = `
                    <div class="win-title">➕ Create Custom App</div>
                    <div class="win-controls"><button class="close-btn">✕</button></div>
                `;
                win.appendChild(titleBar);
                const content = document.createElement('div');
                content.className = 'win-content';
                content.style.display = 'flex';
                content.style.alignItems = 'center';
                content.style.justifyContent = 'center';
                const form = document.createElement('div');
                form.className = 'custom-app-form';
                form.innerHTML = `
                    <h3 style="text-align:center;margin-bottom:8px;">Add a Web App</h3>
                    <input type="text" id="appName" placeholder="App Name" value="My App">
                    <input type="text" id="appIcon" placeholder="Icon (emoji)" value="🌐">
                    <input type="text" id="appUrl" placeholder="URL (e.g. https://example.com)" value="https://example.com">
                    <button id="createAppBtn">Create App</button>
                    <hr style="border-color:var(--glass-border);margin:8px 0;">
                    <h4 style="text-align:center;">Or paste multiple apps (JSON array)</h4>
                    <textarea id="jsonPaste" placeholder='[{"id":"myapp","name":"My App","icon":"🚀","type":"external","url":"https://..."}]'></textarea>
                    <button id="importJsonBtn">Import JSON</button>
                `;
                content.appendChild(form);
                win.appendChild(content);
                desktop.appendChild(win);

                // Close
                titleBar.querySelector('.close-btn').addEventListener('click', () => {
                    win.remove();
                    const idx = openWindows.findIndex(w => w.winElement === win);
                    if (idx !== -1) openWindows.splice(idx, 1);
                    updateTaskbar();
                });

                // Create single app
                form.querySelector('#createAppBtn').addEventListener('click', () => {
                    const name = form.querySelector('#appName').value.trim();
                    const icon = form.querySelector('#appIcon').value.trim() || '🌐';
                    const url = form.querySelector('#appUrl').value.trim();
                    if (!name || !url) { showToast('Error', 'Name and URL required'); return; }
                    try { new URL(url); } catch (_) { showToast('Error', 'Invalid URL'); return; }
                    createCustomApp(name, icon, url);
                    win.remove();
                    const idx = openWindows.findIndex(w => w.winElement === win);
                    if (idx !== -1) openWindows.splice(idx, 1);
                    updateTaskbar();
                });

                // Import JSON array
                form.querySelector('#importJsonBtn').addEventListener('click', () => {
                    const json = form.querySelector('#jsonPaste').value.trim();
                    if (!json) { showToast('Error', 'Paste JSON array'); return; }
                    try {
                        const data = JSON.parse(json);
                        if (!Array.isArray(data)) throw new Error('Not an array');
                        let added = 0;
                        data.forEach(app => {
                            if (!app.id) app.id = 'custom_' + Date.now() + '_' + Math.random().toString(36)
                            .substr(2, 6);
                            if (!app.type) app.type = 'external';
                            if (!getAppById(app.id)) {
                                allApps.push(app);
                                appOrder.push(app.id);
                                added++;
                            }
                        });
                        if (added > 0) {
                            saveAllApps();
                            renderIcons();
                            buildStartMenu();
                            showToast('Import', `Added ${added} apps`);
                            win.remove();
                            const idx = openWindows.findIndex(w => w.winElement === win);
                            if (idx !== -1) openWindows.splice(idx, 1);
                            updateTaskbar();
                        } else {
                            showToast('Info', 'No new apps to import');
                        }
                    } catch (err) {
                        showToast('Error', 'Invalid JSON: ' + err.message);

            function createCustomApp(name, icon, url) {
                const id = 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

                allApps.push(newApp);

                saveAllApps();
                renderIcons();
                buildStartMenu();
                showToast('App Created', `${name} added to desktop`);
                return newApp;
            }

            // ---------- OPEN APP (MAIN) ----------

                const def = getAppById(id);

                // If external, we offer two modes: default window (with about:blank option) or direct open in about:blank.
                if (def.type === 'external') {
                    // Open in a small window (like internal) with iframe, but also add "Open in about:blank" button.

                    // We'll open a new window with iframe, title bar includes "blank" button.
                    // Check if already open as a window (not about:blank)
                    const existing = openWindows.find(w => w.id === id && !w.isBlank);

                    win.className = 'os-window';
                    win.style.zIndex = ++zCounter;
                    win.style.width = '560px';
                    win.style.height = '460px';

                        <div class="win-controls">
                            <button class="min-btn">─</button>
                            <button class="max-btn">⛶</button>
                            <button class="blank-btn" title="Open in about:blank">📂</button>
                            <button class="tab-btn">↗</button>
                            <button class="close-btn">✕</button>
                        </div>
                    `;
                    win.appendChild(titleBar);

                    const content = document.createElement('div');
                    content.className = 'win-content';
                    const iframe = document.createElement('iframe');
                    iframe.src = def.url;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals';
                    content.appendChild(iframe);
                    win.appendChild(content);
                    desktop.appendChild(win);

                    // Controls
                    const closeBtn = titleBar.querySelector('.close-btn');
                    closeBtn.addEventListener('click', () => closeWindow(id));

                    const minBtn = titleBar.querySelector('.min-btn');
                    minBtn.addEventListener('click', () => {
                        const entry = openWindows.find(w => w.id === id && !w.isBlank);
                        if (entry) { entry.minimized = true;
                            win.style.display = 'none';
                            updateTaskbar(); }
                    });

                    const maxBtn = titleBar.querySelector('.max-btn');
                    maxBtn.addEventListener('click', () => {
                        win.classList.toggle('maximized');
                        win.style.resize = win.classList.contains('maximized') ? 'none' : 'both';
                    });

                    const tabBtn = titleBar.querySelector('.tab-btn');
                    tabBtn.addEventListener('click', () => {
                        window.open(def.url, '_blank');
                        showToast('Opened in new tab', def.name);
                    });

                    const blankBtn = titleBar.querySelector('.blank-btn');
                    blankBtn.addEventListener('click', () => {
                        // Open in about:blank popup
                        const blank = window.open('about:blank', '_blank');
                        if (blank) {
                            blank.document.write(`
                                <html><head><title>${def.name}</title>
                                <style>body { margin:0; overflow:hidden; } iframe { width:100%; height:100%; border:none; }</style>
                                </head><body>
                                <iframe src="${def.url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" allowfullscreen></iframe>
                                </body></html>
                            `);
                            blank.document.close();
                            showToast('Opened', `${def.name} in about:blank`);
                        } else {
                            showToast('Popup Blocked', 'Allow popups for this site');
                        }
                    });

                    // Drag
                    let drag = false,
                        ox, oy;
                    titleBar.addEventListener('mousedown', (e) => {
                        if (e.target.tagName === 'BUTTON') return;
                        if (win.classList.contains('maximized')) return;
                        drag = true;
                        const rect = win.getBoundingClientRect();
                        ox = e.clientX - rect.left;
                        oy = e.clientY - rect.top;

                        top = Math.max(0, Math.min(top, window.innerHeight - 100));
                        win.style.left = left + 'px';
                        win.style.top = top + 'px';
                    });
                    document.addEventListener('mouseup', () => { drag = false; });

                    win.addEventListener('mousedown', () => { win.style.zIndex = ++zCounter;
                        updateTaskbar(); });

                    const entry = { id, winElement: win, appDef: def, minimized: false, isBlank: false };
                    openWindows.push(entry);
                    updateTaskbar();
                    showToast('Opened', def.name);
                    return;

                document.addEventListener('mouseup', () => { drag = false; });

                win.addEventListener('mousedown', () => { win.style.zIndex = ++zCounter;
                    updateTaskbar(); });

                const entry = { id, winElement: win, appDef: def, minimized: false, isBlank: false };
                openWindows.push(entry);
                updateTaskbar();
                showToast('Opened', def.name);
            }

            function closeWindow(id) {
                const idx = openWindows.findIndex(w => w.id === id);
                if (idx === -1) return;
                const def = openWindows[idx].appDef;
                openWindows[idx].winElement.remove();
                openWindows.splice(idx, 1);
                updateTaskbar();
                showToast('Closed', def.name);
            }

            // ---------- TASKBAR ----------
            function updateTaskbar() {
                taskItems.innerHTML = '';
                openWindows.forEach(entry => {
                    const btn = document.createElement('button');
                    btn.className = 'task-btn active';
                    if (entry.minimized) btn.classList.add('minimized');
                    const def = entry.appDef;
                    btn.innerHTML = `${def.icon} ${def.name}`;
                    btn.addEventListener('click', () => {
                        if (entry.minimized) { entry.minimized = false;
                            entry.winElement.style.display = 'flex'; }
                        entry.winElement.style.zIndex = ++zCounter;
                        entry.winElement.focus();
                        updateTaskbar();
                    });
                    taskItems.appendChild(btn);
