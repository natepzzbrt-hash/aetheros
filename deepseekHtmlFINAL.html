<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherOS — Ultimate</title>
    <style>
        /* ----- ROOT ----- */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        :root {
            --bg: #0a0a18;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --text: #eee;
            --accent: #7c6cf0;
            --accent-glow: 0 0 30px rgba(124,108,240,0.4);
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0,0,0,0.8);
            --taskbar-height: 60px;
        }
        body {
            width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
            display:flex; flex-direction:column; font-size:14px;
        }
        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:10px; }
        ::-webkit-scrollbar-track { background:rgba(255,255,255,0.02); }

        /* ----- DESKTOP ----- */
        #desktop {
            flex:1; position:relative; background-size:cover; background-position:center; background-color:var(--bg);
            padding:20px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:16px 20px; overflow-y:auto;
            transition:background-image 0.6s ease;
        }
        #desktop::before {
            content:''; position:absolute; inset:0; backdrop-filter:blur(2px); pointer-events:none;
            background:radial-gradient(circle at 20% 30%, rgba(124,108,240,0.05), transparent 60%);
        }

        /* ----- APP ICON ----- */
        .app-icon {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            width:84px; height:98px; cursor:grab; border-radius:var(--radius);
            padding:6px; background:var(--glass); border:1px solid var(--glass-border);
            transition:transform 0.2s cubic-bezier(0.2,0.9,0.3,1.1), background 0.3s, border-color 0.3s, box-shadow 0.3s;
            backdrop-filter:blur(8px); position:relative; z-index:1;
        }
        .app-icon:hover { background:rgba(255,255,255,0.08); border-color:var(--accent); box-shadow:var(--accent-glow); transform:translateY(-3px); }
        .app-icon:active { transform:scale(0.92); cursor:grabbing; }
        .app-icon.dragging { opacity:0.3; border:2px dashed #fff; }
        .app-icon .icon-img { width:44px; height:44px; object-fit:contain; border-radius:12px; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
        .app-icon .icon-emoji { font-size:42px; line-height:1; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
        .app-icon .app-label {
            color:#fff; font-size:11px; font-weight:500; text-align:center; margin-top:4px;
            text-shadow:0 1px 10px #000; background:rgba(0,0,0,0.5); padding:2px 12px; border-radius:30px;
            max-width:78px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }

        /* ----- WINDOW ----- */
        .os-window {
            position:absolute; min-width:360px; min-height:220px; background:rgba(20,20,40,0.88);
            backdrop-filter:blur(30px); border-radius:var(--radius); border:1px solid var(--glass-border);
            box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
            z-index:100; animation:winIn 0.25s cubic-bezier(0.2,0.9,0.3,1.1);
            resize:both;
        }
        @keyframes winIn { from { transform:scale(0.9) translateY(20px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
        .os-window.maximized {
            width:100% !important; height:calc(100% - var(--taskbar-height)) !important; top:0 !important; left:0 !important;
            border-radius:0; resize:none;
        }
        .os-window .title-bar {
            display:flex; align-items:center; justify-content:space-between;
            background:rgba(30,30,55,0.85); padding:6px 14px; cursor:grab; flex-shrink:0;
            border-radius:var(--radius) var(--radius) 0 0; min-height:40px;
            backdrop-filter:blur(12px); border-bottom:1px solid var(--glass-border);
        }
        .os-window .title-bar:active { cursor:grabbing; }
        .os-window .title-bar .win-title {
            display:flex; align-items:center; gap:10px; color:#eee; font-size:14px; font-weight:500;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .os-window .title-bar .win-title img { width:20px; height:20px; border-radius:6px; }
        .os-window .title-bar .win-controls { display:flex; gap:4px; }
        .os-window .title-bar .win-controls button {
            background:none; border:none; color:#ccc; font-size:20px; cursor:pointer;
            padding:0 8px; border-radius:8px; line-height:1.2; transition:0.15s;
            display:flex; align-items:center; justify-content:center;
        }
        .os-window .title-bar .win-controls button:hover { background:rgba(255,255,255,0.12); color:#fff; }
        .os-window .title-bar .win-controls .close-btn:hover { background:#c42b2b; }
        .os-window .title-bar .win-controls .max-btn:hover { background:#2a8a5a; }
        .os-window .title-bar .win-controls .min-btn:hover { background:#4a4a7a; }
        .os-window .title-bar .win-controls .tab-btn:hover { background:#6a4a8a; }
        .os-window .win-content {
            flex:1; background:rgba(12,12,26,0.5); overflow:auto; padding:10px;
            color:#eee; position:relative;
        }
        .os-window .win-content iframe { width:100%; height:100%; border:none; background:#fff; border-radius:8px; }
        .os-window .win-content .internal-app { width:100%; height:100%; display:flex; flex-direction:column; gap:8px; }

        /* ----- TASKBAR ----- */
        #taskbar {
            height:var(--taskbar-height); background:rgba(10,10,24,0.92); backdrop-filter:blur(20px);
            border-top:1px solid var(--glass-border); display:flex; align-items:center; padding:0 18px; gap:12px;
            flex-shrink:0; z-index:999;
        }
        #taskbar .start-btn {
            background:var(--accent); border:none; color:#fff; padding:8px 24px; border-radius:40px;
            cursor:pointer; font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px;
            transition:0.2s; box-shadow:0 0 30px rgba(124,108,240,0.3);
        }
        #taskbar .start-btn:hover { background:#8a7aff; transform:scale(1.03); }
        #taskbar .task-items { display:flex; gap:4px; flex:1; overflow-x:auto; align-items:center; }
        #taskbar .task-items .task-btn {
            background:rgba(255,255,255,0.04); border:1px solid transparent; color:#ddd;
            padding:4px 18px; border-radius:30px; cursor:pointer; font-size:13px; white-space:nowrap;
            transition:0.15s; display:flex; align-items:center; gap:8px;
        }
        #taskbar .task-items .task-btn:hover { background:rgba(255,255,255,0.10); }
        #taskbar .task-items .task-btn.active { border-color:var(--accent); background:rgba(124,108,240,0.15); }
        #taskbar .task-items .task-btn.minimized { opacity:0.5; }
        #taskbar .right { display:flex; align-items:center; gap:16px; }
        #taskbar .right #clock { font-weight:500; background:rgba(255,255,255,0.04); padding:4px 18px; border-radius:40px; border:1px solid var(--glass-border); font-size:14px; }

        /* ----- START MENU ----- */
        #start-menu {
            position:absolute; bottom:calc(var(--taskbar-height) + 10px); left:20px;
            width:400px; max-height:550px; background:rgba(16,16,34,0.96); backdrop-filter:blur(40px);
            border-radius:var(--radius); border:1px solid var(--glass-border); padding:18px 14px;
            display:none; flex-wrap:wrap; gap:8px; overflow-y:auto; z-index:1000;
            box-shadow:0 25px 80px rgba(0,0,0,0.9);
        }
        #start-menu.show { display:flex; }
        #start-menu .start-item {
            display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.04);
            padding:8px 16px; border-radius:40px; cursor:pointer; transition:0.15s;
            color:#eee; font-size:14px; width:calc(50% - 6px);
        }
        #start-menu .start-item:hover { background:rgba(255,255,255,0.12); transform:scale(1.02); }
        #start-menu .start-item img { width:26px; height:26px; border-radius:6px; }
        #start-menu .start-item span { font-size:26px; }

        /* ----- INTERNAL APP STYLES ----- */
        .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
        .calc-grid button { background:rgba(255,255,255,0.06); border:none; color:#fff; font-size:24px; padding:14px 0; border-radius:12px; cursor:pointer; transition:0.08s; }
        .calc-grid button:hover { background:rgba(255,255,255,0.15); }
        .calc-grid .op { background:rgba(124,108,240,0.25); }
        .calc-grid .eq { background:rgba(42,200,80,0.4); }
        .calc-grid .clear { background:rgba(200,50,50,0.3); }
        .calc-display { background:rgba(0,0,0,0.4); padding:12px 18px; border-radius:12px; font-size:32px; text-align:right; font-family:monospace; min-height:60px; border:1px solid var(--glass-border); }

        .notepad-area { width:100%; flex:1; background:rgba(0,0,0,0.3); color:#eee; border:1px solid var(--glass-border); border-radius:10px; padding:12px; font-size:14px; resize:none; font-family:monospace; }
        .notepad-area:focus { outline:none; border-color:var(--accent); }
        .notepad-toolbar { display:flex; gap:10px; flex-wrap:wrap; }
        .notepad-toolbar button { background:rgba(255,255,255,0.06); border:none; color:#eee; padding:6px 20px; border-radius:30px; cursor:pointer; font-size:13px; transition:0.1s; }
        .notepad-toolbar button:hover { background:rgba(255,255,255,0.15); }

        .settings-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); flex-wrap:wrap; }
        .settings-row label { min-width:100px; color:#aaa; font-weight:500; }
        .settings-row input[type="color"] { width:50px; height:40px; border:none; border-radius:10px; cursor:pointer; background:none; }
        .settings-row input[type="file"] { color:#aaa; }
        .settings-row .wallpaper-gallery { display:flex; gap:10px; flex-wrap:wrap; }
        .settings-row .wallpaper-gallery .wall-thumb { width:80px; height:60px; object-fit:cover; border-radius:10px; cursor:pointer; border:2px solid transparent; transition:0.15s; }
        .settings-row .wallpaper-gallery .wall-thumb:hover { border-color:var(--accent); transform:scale(1.05); }
        .settings-row .wallpaper-gallery .wall-thumb.active { border-color:#fff; }

        .proxy-bar { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
        .proxy-bar input { flex:1; background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); border-radius:30px; padding:8px 18px; color:#fff; font-size:14px; min-width:150px; }
        .proxy-bar input:focus { outline:none; border-color:var(--accent); }
        .proxy-bar button { background:var(--accent); border:none; color:#fff; padding:8px 24px; border-radius:30px; cursor:pointer; transition:0.15s; }
        .proxy-bar button:hover { background:#8a7aff; }
        .proxy-frame { flex:1; background:#fff; border:none; border-radius:10px; min-height:300px; }

        /* ========== AETHERFLIX - EMBEDS CINEB.BEST DIRECTLY ========== */
        .aetherflix-wrapper {
            width:100%; height:100%; display:flex; flex-direction:column;
            background: #141414; overflow:hidden; position:relative;
            color:#fff;
        }
        .aetherflix-wrapper .netflix-nav {
            display:flex; align-items:center; padding:10px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            position:relative; z-index:10; gap:20px;
            flex-shrink:0;
        }
        .aetherflix-wrapper .netflix-nav .brand {
            font-size:28px; font-weight:900; color:#e50914; letter-spacing:2px;
        }
        .aetherflix-wrapper .netflix-nav .nav-links {
            display:flex; gap:16px; flex:1;
        }
        .aetherflix-wrapper .netflix-nav .nav-links a {
            color:#ccc; text-decoration:none; font-size:14px; font-weight:500;
            transition:0.15s; cursor:pointer;
        }
        .aetherflix-wrapper .netflix-nav .nav-links a:hover { color:#fff; }
        .aetherflix-wrapper .netflix-content {
            flex:1; overflow:hidden; background:#141414; position:relative;
        }
        .aetherflix-wrapper .netflix-content iframe {
            width:100%; height:100%; border:none;
        }

        /* Game apps */
        .game-wrapper {
            width:100%; height:100%; display:flex; flex-direction:column;
            background: #0a0a18; overflow:hidden; position:relative;
        }
        .game-wrapper .game-toolbar {
            display:flex; gap:8px; padding:4px 10px; background:rgba(0,0,0,0.6); border-radius:8px; margin-bottom:4px; flex-wrap:wrap; z-index:5; position:relative; align-items:center;
        }
        .game-wrapper .game-toolbar button {
            background:var(--accent); border:none; color:#fff; padding:4px 16px; border-radius:20px; cursor:pointer; transition:0.15s;
        }
        .game-wrapper .game-toolbar button:hover { background:#8a7aff; }
        .game-wrapper .game-toolbar .alt-btn { background:#e50914; }
        .game-wrapper .game-toolbar .alt-btn:hover { background:#f40612; }
        .game-wrapper .game-toolbar .info { color:#aaa; font-size:12px; margin-left:auto; display:flex; align-items:center; gap:8px; }
        .game-frame { flex:1; width:100%; background:#000; border-radius:8px; overflow:hidden; }
        .game-frame iframe { width:100%; height:100%; border:none; }

        .terminal-lines { background:rgba(0,0,0,0.5); padding:12px; border-radius:10px; font-family:monospace; font-size:14px; height:100%; overflow-y:auto; white-space:pre-wrap; }
        .terminal-lines .prompt { color:#8aff8a; }
        .terminal-input-line { display:flex; align-items:center; gap:8px; padding:4px 0; border-top:1px solid rgba(255,255,255,0.05); }
        .terminal-input-line .prompt { color:#8aff8a; }
        .terminal-input-line input { flex:1; background:transparent; border:none; color:#fff; font-family:monospace; font-size:14px; outline:none; }

        .music-player { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; height:100%; padding:20px; }
        .music-player .cover { width:140px; height:140px; background:var(--accent); border-radius:30px; display:flex; align-items:center; justify-content:center; font-size:70px; box-shadow:0 0 40px rgba(124,108,240,0.3); }
        .music-player .controls { display:flex; gap:24px; }
        .music-player .controls button { background:rgba(255,255,255,0.06); border:none; color:#fff; font-size:30px; padding:10px 24px; border-radius:50px; cursor:pointer; transition:0.15s; }
        .music-player .controls button:hover { background:rgba(255,255,255,0.12); }

        .appstore-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
        .appstore-item { background:rgba(255,255,255,0.04); border-radius:12px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; transition:0.15s; border:1px solid transparent; }
        .appstore-item:hover { background:rgba(255,255,255,0.08); border-color:var(--accent); transform:translateY(-2px); }
        .appstore-item .app-icon-big { font-size:48px; }
        .appstore-item .app-name { font-weight:500; font-size:14px; text-align:center; }
        .appstore-item .app-btn { background:var(--accent); border:none; color:#fff; padding:4px 18px; border-radius:30px; cursor:pointer; font-size:12px; transition:0.1s; }
        .appstore-item .app-btn:hover { background:#8a7aff; }

        .explorer-tree { display:flex; gap:12px; height:100%; }
        .explorer-sidebar { width:160px; background:rgba(0,0,0,0.2); border-radius:10px; padding:8px; overflow-y:auto; flex-shrink:0; }
        .explorer-sidebar .folder-item { padding:6px 10px; border-radius:6px; cursor:pointer; transition:0.1s; display:flex; align-items:center; gap:8px; }
        .explorer-sidebar .folder-item:hover { background:rgba(255,255,255,0.06); }
        .explorer-main { flex:1; background:rgba(0,0,0,0.15); border-radius:10px; padding:8px; overflow-y:auto; }
        .explorer-main .file-item { display:flex; align-items:center; gap:10px; padding:4px 8px; border-radius:4px; cursor:default; }
        .explorer-main .file-item:hover { background:rgba(255,255,255,0.04); }

        .weather-display { display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px; }
        .weather-display .temp { font-size:48px; font-weight:200; }
        .weather-display .desc { font-size:20px; color:#aaa; }

        .sysinfo-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .sysinfo-card { background:rgba(0,0,0,0.2); border-radius:10px; padding:14px; }
        .sysinfo-card .label { color:#888; font-size:12px; text-transform:uppercase; }
        .sysinfo-card .value { font-size:18px; font-weight:500; margin-top:4px; }

        .toast-container { position:fixed; bottom:80px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:9999; }
        .toast { background:rgba(20,20,40,0.9); backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-radius:12px; padding:12px 20px; box-shadow:var(--shadow); animation:slideIn 0.3s ease; }
        .toast .toast-title { font-weight:600; color:#fff; }
        .toast .toast-msg { color:#aaa; font-size:13px; }
        @keyframes slideIn { from { transform:translateX(40px); opacity:0; } to { transform:translateX(0); opacity:1; } }

        @media (max-width:640px) {
            #start-menu { width:calc(100% - 32px); left:16px; }
            .os-window { width:92% !important; left:4% !important; min-width:unset; }
            .settings-row { flex-direction:column; align-items:flex-start; }
            .aetherflix-wrapper .netflix-nav { flex-wrap:wrap; gap:10px; }
            .aetherflix-wrapper .netflix-nav .nav-links { flex-wrap:wrap; }
        }
    </style>
</head>

                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=3840&q=80',
                'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=3840&q=80',
                'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=3840&q=80',
                'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=3840&q=80'
            ];

            // ---------- STATE ----------
            let appOrder = [];
            let openWindows = [];
            let zCounter = 100;
            let wallpaperData = null;
            let accentColor = '#7c6cf0';

            // ---------- DOM ----------
            const desktop = document.getElementById('desktop');
            const startMenu = document.getElementById('start-menu');
            const startBtn = document.getElementById('startBtn');
            const taskItems = document.getElementById('taskItems');
            const clockEl = document.getElementById('clock');
            const toastContainer = document.getElementById('toastContainer');

            // ---------- STORAGE ----------
            const STORAGE_ORDER = 'aether_order';
            const STORAGE_WALL = 'aether_wall';
            const STORAGE_NOTEPAD = 'aether_notepad';
            const STORAGE_ACCENT = 'aether_accent';

            function loadOrder() {
                const saved = localStorage.getItem(STORAGE_ORDER);
                if (saved) {
                    try { const parsed = JSON.parse(saved); if (Array.isArray(parsed) && parsed.length === APP_DEFS.length) { appOrder = parsed; return; } } catch (_) {}
                }
                appOrder = APP_DEFS.map(a => a.id);
            }
            function saveOrder() { localStorage.setItem(STORAGE_ORDER, JSON.stringify(appOrder)); }

            function loadWallpaper() {
                const w = localStorage.getItem(STORAGE_WALL);
                if (w) { wallpaperData = w; applyWallpaper(w); }
            }
            function saveWallpaper() {
                if (wallpaperData) localStorage.setItem(STORAGE_WALL, wallpaperData);
                else localStorage.removeItem(STORAGE_WALL);
            }

            function loadAccent() {
                const a = localStorage.getItem(STORAGE_ACCENT);
                if (a) { accentColor = a; document.documentElement.style.setProperty('--accent', a); }
            }
            function saveAccent(c) { localStorage.setItem(STORAGE_ACCENT, c); }

            function applyWallpaper(data) {
                if (data) { desktop.style.backgroundImage = `url(${data})`; desktop.style.backgroundColor = 'transparent'; }
                else { desktop.style.backgroundImage = 'none'; desktop.style.backgroundColor = 'var(--bg)'; }
            }

            // ---------- TOAST ----------
            function showToast(title, msg, duration = 3000) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${msg}</div>`;
                toastContainer.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, duration);
            }

            // ---------- FAVICON ----------
            function getFaviconUrl(url) {
                try { const u = new URL(url); return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`; } catch (_) { return null; }
            }

            // ---------- RENDER ICONS ----------
            function renderIcons() {
                desktop.querySelectorAll('.app-icon').forEach(el => el.remove());
                appOrder.forEach(id => {
                    const def = APP_DEFS.find(d => d.id === id);
                    if (!def) return;
                    const icon = document.createElement('div');
                    icon.className = 'app-icon';
                    icon.draggable = true;
                    icon.dataset.id = id;
                    const iconContent = def.type === 'internal' ?
                        `<span class="icon-emoji">${def.icon}</span>` :
                        `<img class="icon-img" src="${getFaviconUrl(def.url) || ''}" alt="${def.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="icon-emoji" style="display:none;">${def.icon}</span>`;
                    icon.innerHTML = `${iconContent}<span class="app-label">${def.name}</span>`;
                    icon.addEventListener('dblclick', () => openApp(id));
                    icon.addEventListener('dragstart', dragStart);
                    icon.addEventListener('dragend', dragEnd);
                    icon.addEventListener('dragover', dragOver);
                    icon.addEventListener('drop', drop);
                    desktop.appendChild(icon);
                });
            }

            // ---------- DRAG & DROP ----------
            let dragId = null;
            function dragStart(e) {
                const el = e.currentTarget;
                dragId = el.dataset.id;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragId);
            }
            function dragEnd(e) { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.app-icon.drag-over').forEach(el => el.classList.remove('drag-over')); }
            function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const t = e.currentTarget; if (t.classList.contains('app-icon')) t.classList.add('drag-over'); }
            function drop(e) {
                e.preventDefault();
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                const srcId = e.dataTransfer.getData('text/plain');
                const tgtId = target.dataset.id;
                if (!srcId || !tgtId || srcId === tgtId) return;
                const srcIdx = appOrder.indexOf(srcId);
                const tgtIdx = appOrder.indexOf(tgtId);
                if (srcIdx === -1 || tgtIdx === -1) return;
                appOrder.splice(tgtIdx, 0, appOrder.splice(srcIdx, 1)[0]);
                saveOrder();
                renderIcons();
                showToast('Order Updated', `${APP_DEFS.find(d=>d.id===srcId).name} moved`);
            }
            desktop.addEventListener('dragover', e => e.preventDefault());
            desktop.addEventListener('drop', e => e.preventDefault());

            // ---------- START MENU ----------
            function buildStartMenu() {
                startMenu.innerHTML = '';
                APP_DEFS.forEach(def => {
                    const item = document.createElement('div');
                    item.className = 'start-item';
                    const iconHtml = def.type === 'internal' ?
                        `<span>${def.icon}</span>` :
                        `<img src="${getFaviconUrl(def.url) || ''}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none;">${def.icon}</span>`;
                    item.innerHTML = `${iconHtml} ${def.name}`;
                    item.addEventListener('click', () => { openApp(def.id); startMenu.classList.remove('show'); });
                    startMenu.appendChild(item);
                });
            }
            startBtn.addEventListener('click', (e) => { e.stopPropagation(); startMenu.classList.toggle('show'); });
            document.addEventListener('click', (e) => { if (!startMenu.contains(e.target) && e.target !== startBtn) startMenu.classList.remove('show'); });

            // ---------- OPEN APP ----------
            function openApp(id) {
                const def = APP_DEFS.find(d => d.id === id);
                if (!def) return;

                const existing = openWindows.find(w => w.id === id);
                if (existing) {
                    existing.winElement.style.zIndex = ++zCounter;
                    if (existing.minimized) { existing.minimized = false; existing.winElement.style.display = 'flex'; }
                    existing.winElement.focus();
                    updateTaskbar();
                    return;
                }

                const win = document.createElement('div');
                win.className = 'os-window';
                win.style.zIndex = ++zCounter;
                win.style.width = (def.type === 'internal') ? '560px' : '780px';
                win.style.height = (def.type === 'internal') ? '460px' : '520px';
                win.style.left = (40 + Math.random() * 80) + 'px';
                win.style.top = (40 + Math.random() * 60) + 'px';

                // Title bar
                const titleBar = document.createElement('div');
                titleBar.className = 'title-bar';
                const iconHtml = def.type === 'internal' ?
                    `<span>${def.icon}</span>` :
                    `<img src="${getFaviconUrl(def.url) || ''}" onerror="this.style.display='none'" style="width:20px;height:20px;border-radius:6px;">`;
                titleBar.innerHTML = `
                    <div class="win-title">${iconHtml} ${def.name}</div>
                    <div class="win-controls">
                        <button class="min-btn" title="Minimize">─</button>
                        <button class="max-btn" title="Maximize">⛶</button>
                        <button class="tab-btn" title="Open in new tab">↗</button>
                        <button class="close-btn" title="Close">✕</button>
                    </div>
                `;
                win.appendChild(titleBar);

                // Content
                const content = document.createElement('div');
                content.className = 'win-content';
                if (def.type === 'internal') {
                    content.innerHTML = `<div class="internal-app" id="app-${def.id}"></div>`;
                    win.appendChild(content);
                    renderInternalApp(def.id, content.querySelector('.internal-app'));
                } else {
                    const iframe = document.createElement('iframe');
                    iframe.src = def.url;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals';
                    content.appendChild(iframe);
                    win.appendChild(content);
                }

                desktop.appendChild(win);

                // Controls
                const closeBtn = titleBar.querySelector('.close-btn');
                closeBtn.addEventListener('click', () => closeWindow(id));

                const minBtn = titleBar.querySelector('.min-btn');
                minBtn.addEventListener('click', () => {
                    const entry = openWindows.find(w => w.id === id);
                    if (entry) { entry.minimized = true; win.style.display = 'none'; updateTaskbar(); }
                });

                const maxBtn = titleBar.querySelector('.max-btn');
                maxBtn.addEventListener('click', () => {
                    win.classList.toggle('maximized');
                    win.style.resize = win.classList.contains('maximized') ? 'none' : 'both';
                });

                const tabBtn = titleBar.querySelector('.tab-btn');
                tabBtn.addEventListener('click', () => {
                    if (def.url) { window.open(def.url, '_blank'); showToast('Opened in new tab', def.name); }
                    else showToast('Internal App', 'No external URL');
                });

                // Drag
                let drag = false, ox, oy;
                titleBar.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    if (win.classList.contains('maximized')) return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = e.clientX - rect.left;
                    oy = e.clientY - rect.top;
                    win.style.zIndex = ++zCounter;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    let left = e.clientX - ox, top = e.clientY - oy;
                    left = Math.max(0, Math.min(left, window.innerWidth - 60));
                    top = Math.max(0, Math.min(top, window.innerHeight - 100));
                    win.style.left = left + 'px';
                    win.style.top = top + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false; });

                win.addEventListener('mousedown', () => { win.style.zIndex = ++zCounter; updateTaskbar(); });

                const entry = { id, winElement: win, appDef: def, minimized: false };
                openWindows.push(entry);
                updateTaskbar();
                showToast('Opened', def.name);
            }

            function closeWindow(id) {
                const idx = openWindows.findIndex(w => w.id === id);
                if (idx === -1) return;
                const def = openWindows[idx].appDef;
                openWindows[idx].winElement.remove();
                openWindows.splice(idx, 1);
                updateTaskbar();
                showToast('Closed', def.name);
            }

            // ---------- TASKBAR ----------
            function updateTaskbar() {
                taskItems.innerHTML = '';
                openWindows.forEach(entry => {
                    const btn = document.createElement('button');
                    btn.className = 'task-btn active';
                    if (entry.minimized) btn.classList.add('minimized');
                    const def = entry.appDef;
                    const iconHtml = def.type === 'internal' ?
                        def.icon :
                        `<img src="${getFaviconUrl(def.url) || ''}" onerror="this.style.display='none'" style="width:16px;height:16px;border-radius:4px;">`;
                    btn.innerHTML = `${iconHtml} ${def.name}`;
                    btn.addEventListener('click', () => {
                        if (entry.minimized) { entry.minimized = false; entry.winElement.style.display = 'flex'; }
                        entry.winElement.style.zIndex = ++zCounter;
                        entry.winElement.focus();
                        updateTaskbar();
                    });
                    taskItems.appendChild(btn);
                });
            }

                switch (id) {
                    case 'calc': renderCalculator(container); break;
                    case 'notepad': renderNotepad(container); break;

                        const v = btn.dataset.v;
                        if (v === 'C') { expr = ''; update(); return; }
                        if (v === '=') {
                            try { const result = Function('"use strict"; return (' + expr.replace(/×/g,'*').replace(/÷/g,'/') + ')')(); expr = String(result); } catch (_) { expr = 'Error'; }
                            update(); return;
                        }
                        if (v === '±') { if (expr.startsWith('-')) expr = expr.slice(1); else if (expr && expr !== '0') expr = '-' + expr; update(); return; }
                        if (v === '%') { try { const val = Function('"use strict"; return (' + expr.replace(/×/g,'*').replace(/÷/g,'/') + ')')(); expr = String(val / 100); } catch (_) {} update(); return; }
                        expr += v; update();
                    });
                });
            }

                    <div class="settings-row">
                        <label>Wallpaper</label>
                        <div class="wallpaper-gallery" id="wallGallery"></div>
                        <input type="file" id="wallInput" accept="image/*" style="display:none;">
                        <button id="wallUploadBtn">📁 Upload</button>
                        <button id="wallReset">Reset</button>
                    </div>
                    <div class="settings-row">
                        <label>Accent Color</label>
                        <input type="color" id="accentColor" value="${accentColor}">
                    </div>
                    <div style="margin-top:12px;color:#888;font-size:13px;">
                        <p>App order is saved automatically. Drag icons to reorder.</p>
                        <p>Notepad content saved locally.</p>
                    </div>
                `;
                const gallery = container.querySelector('#wallGallery');
                BUILTIN_WALLPAPERS.forEach(url => {
                    const thumb = document.createElement('img');
                    thumb.className = 'wall-thumb';
                    thumb.src = url;
                    thumb.alt = 'wallpaper';
                    thumb.addEventListener('click', () => {
                        wallpaperData = url;
                        applyWallpaper(url);
                        saveWallpaper();
                        gallery.querySelectorAll('.wall-thumb').forEach(el => el.classList.remove('active'));
                        thumb.classList.add('active');
                        showToast('Wallpaper', 'Changed');
                    });
                    gallery.appendChild(thumb);
                });
                const uploadBtn = container.querySelector('#wallUploadBtn');
                const fileInput = container.querySelector('#wallInput');
                uploadBtn.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => { wallpaperData = ev.target.result; applyWallpaper(wallpaperData); saveWallpaper(); fileInput.value = ''; showToast('Wallpaper', 'Uploaded'); };
                    reader.readAsDataURL(file);
                });
                container.querySelector('#wallReset').addEventListener('click', () => {
                    wallpaperData = null;
                    applyWallpaper(null);
                    saveWallpaper();
                    gallery.querySelectorAll('.wall-thumb').forEach(el => el.classList.remove('active'));
                    showToast('Wallpaper', 'Reset to default');
                });
                const colorInput = container.querySelector('#accentColor');
                colorInput.addEventListener('input', () => {
                    const c = colorInput.value;
                    accentColor = c;
                    document.documentElement.style.setProperty('--accent', c);
                    saveAccent(c);
                    showToast('Accent', 'Color updated');
                });
            }

            function renderProxy(container) {
                container.innerHTML = `
                    <div class="proxy-bar">
                        <input id="proxyUrl" placeholder="Search or enter URL" value="DuckDuckGo">
                        <button id="proxyGo">🔍 Go</button>
                        <button id="proxyDdg">🦆 DDG</button>
                        <select id="proxySelect" style="background:rgba(0,0,0,0.4);border:1px solid var(--glass-border);border-radius:30px;padding:6px 14px;color:#fff;">
                            <option value="allorigins" selected>AllOrigins</option>
                            <option value="corsproxy">corsproxy.io</option>
                            <option value="corsanywhere">CORS Anywhere</option>
                            <option value="lucideproxy">LucideProxy</option>
                        </select>
                    </div>
                    <iframe class="proxy-frame" id="proxyFrame" src="about:blank"></iframe>
                `;
                const input = container.querySelector('#proxyUrl');
                const frame = container.querySelector('#proxyFrame');
                const go = container.querySelector('#proxyGo');
                const ddg = container.querySelector('#proxyDdg');
                const select = container.querySelector('#proxySelect');

                const proxyMap = {
                    'allorigins': (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    'corsproxy': (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
                    'corsanywhere': (url) => `https://cors-anywhere.herokuapp.com/${url}`,
                    'lucideproxy': (url) => `https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/?url=${encodeURIComponent(url)}`
                };

                const loadUrl = (url) => {
                    let finalUrl = url.trim();
                    if (!finalUrl) return;
                    if (!finalUrl.includes('.') && !finalUrl.startsWith('http')) {
                        finalUrl = `https://duckduckgo.com/?q=${encodeURIComponent(finalUrl)}`;
                    } else if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                        finalUrl = 'https://' + finalUrl;
                    }
                    const proxyFn = proxyMap[select.value] || proxyMap['allorigins'];
                    const proxied = proxyFn(finalUrl);
                    frame.src = proxied;
                    showToast('Proxy', `Loading via ${select.value}...`);
                };

                go.addEventListener('click', () => loadUrl(input.value));
                ddg.addEventListener('click', () => {
                    input.value = 'DuckDuckGo';
                    loadUrl('https://duckduckgo.com');
                });
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(input.value); });
                setTimeout(() => loadUrl('https://duckduckgo.com'), 400);
            }

            function renderTerminal(container) {
                container.innerHTML = `
                    <div class="terminal-lines" id="termLines">
                        <div><span class="prompt">user@aether:~$</span> <span style="color:#8aff8a;">Welcome to AetherOS Terminal</span></div>
                        <div><span class="prompt">user@aether:~$</span> <span style="color:#aaa;">Type commands: echo, date, clear, help, whoami, ls, uname</span></div>
                    </div>
                    <div class="terminal-input-line">
                        <span class="prompt">$</span>
                        <input id="termInput" autofocus>
                    </div>
                `;
                const lines = container.querySelector('#termLines');
                const input = container.querySelector('#termInput');
                const history = [];
                let histIdx = 0;
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value.trim();
                        if (!cmd) return;
                        lines.innerHTML += `<div><span class="prompt">$</span> ${cmd}</div>`;
                        let output = '';
                        const parts = cmd.split(' ');
                        const main = parts[0].toLowerCase();
                        if (main === 'echo') output = parts.slice(1).join(' ');
                        else if (main === 'help') output = 'Commands: echo, date, clear, help, whoami, ls, uname';
                        else if (main === 'date') output = new Date().toString();
                        else if (main === 'clear') { lines.innerHTML = ''; input.value = ''; return; }
                        else if (main === 'whoami') output = 'aether-user';
                        else if (main === 'ls') output = 'Desktop  Documents  Downloads  Music  Pictures  Videos';
                        else if (main === 'uname') output = 'AetherOS 2.0 (Ultimate)';
                        else output = `Command not found: ${cmd}`;
                        lines.innerHTML += `<div><span style="color:#aaa;">${output}</span></div>`;
                        lines.scrollTop = lines.scrollHeight;
                        input.value = '';
                        history.push(cmd);
                        histIdx = history.length;
                    } else if (e.key === 'ArrowUp') { if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ''; } e.preventDefault(); }
                    else if (e.key === 'ArrowDown') { if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx] || ''; } else { histIdx = history.length; input.value = ''; } e.preventDefault(); }
                });
                container.addEventListener('click', () => input.focus());
            }

            function renderMusic(container) {
                container.innerHTML = `
                    <div class="music-player">
                        <div class="cover">🎵</div>
                        <div style="font-size:22px;font-weight:600;">Now Playing</div>
                        <div style="color:#aaa;">AetherOS Radio</div>
                        <div class="controls">
                            <button id="prev">⏮</button>
                            <button id="play">▶️</button>
                            <button id="next">⏭</button>
                        </div>
                        <div style="color:#888;font-size:13px;">(Dummy - no actual audio)</div>
                    </div>
                `;
                let playing = false;
                const playBtn = container.querySelector('#play');
                playBtn.addEventListener('click', () => {
                    playing = !playing;
                    playBtn.textContent = playing ? '⏸' : '▶️';
                    showToast('Music', playing ? 'Playing' : 'Paused');
                });
                container.querySelector('#prev').addEventListener('click', () => showToast('Music', 'Previous (dummy)'));
                container.querySelector('#next').addEventListener('click', () => showToast('Music', 'Next (dummy)'));
            }

            function renderAppStore(container) {
                container.innerHTML = `<div class="appstore-grid" id="appstoreGrid"></div>`;
                const grid = container.querySelector('#appstoreGrid');
                APP_DEFS.forEach(def => {
                    const item = document.createElement('div');
                    item.className = 'appstore-item';
                    const iconHtml = def.type === 'internal' ?
                        `<span class="app-icon-big">${def.icon}</span>` :
                        `<img src="${getFaviconUrl(def.url) || ''}" style="width:48px;height:48px;border-radius:12px;" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="app-icon-big" style="display:none;">${def.icon}</span>`;
                    item.innerHTML = `${iconHtml}<div class="app-name">${def.name}</div><button class="app-btn" data-id="${def.id}">Open</button>`;
                    item.querySelector('.app-btn').addEventListener('click', (e) => { e.stopPropagation(); openApp(def.id); });
                    grid.appendChild(item);
                });
            }

            function renderExplorer(container) {
                container.innerHTML = `
                    <div class="explorer-tree">
                        <div class="explorer-sidebar">
                            <div class="folder-item">📁 Desktop</div>
                            <div class="folder-item">📁 Documents</div>
                            <div class="folder-item">📁 Downloads</div>
                            <div class="folder-item">📁 Music</div>
                            <div class="folder-item">📁 Pictures</div>
                            <div class="folder-item">📁 Videos</div>
                        </div>
                        <div class="explorer-main" id="explorerMain">
                            <div class="file-item">📄 readme.txt</div>
                            <div class="file-item">📄 notes.md</div>
                            <div class="file-item">📁 projects</div>
                            <div class="file-item">🖼️ wallpaper.png</div>
                            <div class="file-item">🎵 song.mp3</div>
                        </div>
                    </div>
                `;
                container.querySelectorAll('.folder-item, .file-item').forEach(el => {
                    el.addEventListener('click', () => showToast('Explorer', `Selected: ${el.textContent.trim()}`));
                });
            }

            function renderWeather(container) {
                container.innerHTML = `
                    <div class="weather-display">
                        <div style="font-size:70px;">🌤️</div>
                        <div class="temp">24°C</div>
                        <div class="desc">Partly Cloudy</div>
                        <div style="color:#888;">Humidity: 65% • Wind: 12 km/h</div>
                        <div style="color:#aaa;font-size:13px;">(Dummy weather data)</div>
                    </div>
                `;
            }

            function renderSysInfo(container) {
                container.innerHTML = `
                    <div class="sysinfo-grid">
                        <div class="sysinfo-card"><div class="label">OS</div><div class="value">AetherOS 2.0</div></div>
                        <div class="sysinfo-card"><div class="label">Kernel</div><div class="value">Aether-5.15</div></div>
                        <div class="sysinfo-card"><div class="label">CPU</div><div class="value">Quantum Core x64</div></div>
                        <div class="sysinfo-card"><div class="label">Memory</div><div class="value">16 GB (12 GB free)</div></div>
                        <div class="sysinfo-card"><div class="label">Uptime</div><div class="value" id="uptime">0h 0m</div></div>
                        <div class="sysinfo-card"><div class="label">Theme</div><div class="value">Dark • Accent ${accentColor}</div></div>
                    </div>
                `;
                let seconds = 0;
                setInterval(() => {
                    seconds++;
                    const h = Math.floor(seconds / 3600);
                    const m = Math.floor((seconds % 3600) / 60);
                    const uptimeEl = container.querySelector('#uptime');
                    if (uptimeEl) uptimeEl.textContent = `${h}h ${m}m`;
                }, 1000);
            }

            // ---------- CLOCK ----------
            function updateClock() {
                const d = new Date();
                const dateStr = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
                const timeStr = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
                clockEl.textContent = `${dateStr}  ${timeStr}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // ---------- INIT ----------
            loadOrder();
            loadWallpaper();
            loadAccent();
            renderIcons();
            buildStartMenu();

            setTimeout(() => showToast('Welcome', 'AetherOS — AetherFlix embeds Cineb.best directly!'), 800);

        })();
    </script>
