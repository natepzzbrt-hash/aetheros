<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherOS — Ultimate</title>
    <style>
        /* ----- ROOT ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        :root {
            --bg: #0a0a18;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #eee;
            --accent: #7c6cf0;
            --accent-glow: 0 0 30px rgba(124, 108, 240, 0.4);
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --taskbar-height: 60px;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        #desktop {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: var(--bg);
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 16px 20px;
            overflow-y: auto;
            transition: background-image 0.6s ease;
        }
        #desktop::before {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(2px);
            pointer-events: none;
            background: radial-gradient(circle at 20% 30%, rgba(124, 108, 240, 0.05), transparent 60%);
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 98px;
            cursor: grab;
            border-radius: var(--radius);
            padding: 6px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1), background 0.3s, border-color 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 1;
        }
        .app-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: var(--accent-glow);
            transform: translateY(-3px);
        }
        .app-icon:active {
            transform: scale(0.92);
            cursor: grabbing;
        }
        .app-icon.dragging {
            opacity: 0.3;
            border: 2px dashed #fff;
        }
        .app-icon .icon-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .app-icon .icon-emoji {
            font-size: 42px;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .app-icon .app-label {
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 4px;
            text-shadow: 0 1px 10px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 12px;
            border-radius: 30px;
            max-width: 78px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ----- Context Menu ----- */
        #context-menu {
            position: fixed;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 6px 0;
            min-width: 180px;
            z-index: 9999;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
        }
        #context-menu .menu-item {
            padding: 8px 20px;
            color: #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: 0.1s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        #context-menu .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        #context-menu .menu-item.danger {
            color: #e50914;
        }
        #context-menu .menu-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 4px 12px;
        }

        /* ----- WINDOW ----- */
        .os-window {
            position: absolute;
            min-width: 360px;
            min-height: 220px;
            background: rgba(20, 20, 40, 0.88);
            backdrop-filter: blur(30px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
            animation: winIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            resize: both;
        }
        @keyframes winIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .os-window.maximized {
            width: 100% !important;
            height: calc(100% - var(--taskbar-height)) !important;
            top: 0 !important;
            left: 0 !important;
            border-radius: 0;
            resize: none;
        }
        .os-window .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 55, 0.85);
            padding: 6px 14px;
            cursor: grab;
            flex-shrink: 0;
            border-radius: var(--radius) var(--radius) 0 0;
            min-height: 40px;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }
        .os-window .title-bar:active {
            cursor: grabbing;
        }
        .os-window .title-bar .win-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #eee;
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .os-window .title-bar .win-title img {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }
        .os-window .title-bar .win-controls {
            display: flex;
            gap: 4px;
        }
        .os-window .title-bar .win-controls button {
            background: none;
            border: none;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            padding: 0 8px;
            border-radius: 8px;
            line-height: 1.2;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .os-window .title-bar .win-controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .os-window .title-bar .win-controls .close-btn:hover {
            background: #c42b2b;
        }
        .os-window .title-bar .win-controls .max-btn:hover {
            background: #2a8a5a;
        }
        .os-window .title-bar .win-controls .min-btn:hover {
            background: #4a4a7a;
        }
        .os-window .title-bar .win-controls .tab-btn:hover {
            background: #6a4a8a;
        }
        .os-window .title-bar .win-controls .blank-btn:hover {
            background: #4a6a8a;
        }
        .os-window .win-content {
            flex: 1;
            background: rgba(12, 12, 26, 0.5);
            overflow: auto;
            padding: 10px;
            color: #eee;
            position: relative;
        }
        .os-window .win-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            border-radius: 8px;
        }
        .os-window .win-content .internal-app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ----- TASKBAR ----- */
        #taskbar {
            height: var(--taskbar-height);
            background: rgba(10, 10, 24, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            flex-shrink: 0;
            z-index: 999;
        }
        #taskbar .start-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 0 30px rgba(124, 108, 240, 0.3);
        }
        #taskbar .start-btn:hover {
            background: #8a7aff;
            transform: scale(1.03);
        }
        #taskbar .task-items {
            display: flex;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            align-items: center;
        }
        #taskbar .task-items .task-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            color: #ddd;
            padding: 4px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #taskbar .task-items .task-btn:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        #taskbar .task-items .task-btn.active {
            border-color: var(--accent);
            background: rgba(124, 108, 240, 0.15);
        }
        #taskbar .task-items .task-btn.minimized {
            opacity: 0.5;
        }
        #taskbar .right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        #taskbar .right #clock {
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            font-size: 14px;
        }

        /* ----- START MENU ----- */
        #start-menu {
            position: absolute;
            bottom: calc(var(--taskbar-height) + 10px);
            left: 20px;
            width: 400px;
            max-height: 550px;
            background: rgba(16, 16, 34, 0.96);
            backdrop-filter: blur(40px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            padding: 18px 14px;
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
        }
        #start-menu.show {
            display: flex;
        }
        #start-menu .start-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            color: #eee;
            font-size: 14px;
            width: calc(50% - 6px);
        }
        #start-menu .start-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }
        #start-menu .start-item img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }
        #start-menu .start-item span {
            font-size: 26px;
        }

        /* ----- INTERNAL APP STYLES (same as before) ----- */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .calc-grid button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #fff;
            font-size: 24px;
            padding: 14px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.08s;
        }
        .calc-grid button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .calc-grid .op {
            background: rgba(124, 108, 240, 0.25);
        }
        .calc-grid .eq {
            background: rgba(42, 200, 80, 0.4);
        }
        .calc-grid .clear {
            background: rgba(200, 50, 50, 0.3);
        }
        .calc-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 32px;
            text-align: right;
            font-family: monospace;
            min-height: 60px;
            border: 1px solid var(--glass-border);
        }
        .notepad-area {
            width: 100%;
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            color: #eee;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            font-family: monospace;
        }
        .notepad-area:focus {
            outline: none;
            border-color: var(--accent);
        }
        .notepad-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .notepad-toolbar button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #eee;
            padding: 6px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.1s;
        }
        .notepad-toolbar button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
        }
        .settings-row label {
            min-width: 100px;
            color: #aaa;
            font-weight: 500;
        }
        .settings-row input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: none;
        }
        .settings-row input[type="file"] {
            color: #aaa;
        }
        .settings-row .wallpaper-gallery {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-row .wallpaper-gallery .wall-thumb {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
        }
        .settings-row .wallpaper-gallery .wall-thumb:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .settings-row .wallpaper-gallery .wall-thumb.active {
            border-color: #fff;
        }
        .proxy-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .proxy-bar input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px 18px;
            color: #fff;
            font-size: 14px;
            min-width: 150px;
        }
        .proxy-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .proxy-bar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
        }
        .proxy-bar button:hover {
            background: #8a7aff;
        }
        .proxy-frame {
            flex: 1;
            background: #fff;
            border: none;
            border-radius: 10px;
            min-height: 300px;
        }
        .aetherflix-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #141414;
            overflow: hidden;
            position: relative;
            color: #fff;
        }
        .aetherflix-wrapper .netflix-nav {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            position: relative;
            z-index: 10;
            gap: 20px;
            flex-shrink: 0;
        }
        .aetherflix-wrapper .netflix-nav .brand {
            font-size: 28px;
            font-weight: 900;
            color: #e50914;
            letter-spacing: 2px;
        }
        .aetherflix-wrapper .netflix-nav .nav-links {
            display: flex;
            gap: 16px;
            flex: 1;
        }
        .aetherflix-wrapper .netflix-nav .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.15s;
            cursor: pointer;
        }
        .aetherflix-wrapper .netflix-nav .nav-links a:hover {
            color: #fff;
        }
        .aetherflix-wrapper .netflix-content {
            flex: 1;
            overflow: hidden;
            background: #141414;
            position: relative;
        }
        .aetherflix-wrapper .netflix-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0a0a18;
            overflow: hidden;
            position: relative;
        }
        .game-wrapper .game-toolbar {
            display: flex;
            gap: 8px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
            z-index: 5;
            position: relative;
            align-items: center;
        }
        .game-wrapper .game-toolbar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.15s;
        }
        .game-wrapper .game-toolbar button:hover {
            background: #8a7aff;
        }
        .game-wrapper .game-toolbar .alt-btn {
            background: #e50914;
        }
        .game-wrapper .game-toolbar .alt-btn:hover {
            background: #f40612;
        }
        .game-wrapper .game-toolbar .info {
            color: #aaa;
            font-size: 12px;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-frame {
            flex: 1;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .game-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .terminal-lines {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .terminal-lines .prompt {
            color: #8aff8a;
        }
        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .terminal-input-line .prompt {
            color: #8aff8a;
        }
        .terminal-input-line input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        .music-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            height: 100%;
            padding: 20px;
        }
        .music-player .cover {
            width: 140px;
            height: 140px;
            background: var(--accent);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 0 0 40px rgba(124, 108, 240, 0.3);
        }
        .music-player .controls {
            display: flex;
            gap: 24px;
        }
        .music-player .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #fff;
            font-size: 30px;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.15s;
        }
        .music-player .controls button:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .appstore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .appstore-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .appstore-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .appstore-item .app-icon-big {
            font-size: 48px;
        }
        .appstore-item .app-name {
            font-weight: 500;
            font-size: 14px;
            text-align: center;
        }
        .appstore-item .app-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 4px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.1s;
        }
        .appstore-item .app-btn:hover {
            background: #8a7aff;
        }
        .explorer-tree {
            display: flex;
            gap: 12px;
            height: 100%;
        }
        .explorer-sidebar {
            width: 160px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .explorer-sidebar .folder-item {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .explorer-sidebar .folder-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .explorer-main {
            flex: 1;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 8px;
            overflow-y: auto;
        }
        .explorer-main .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: default;
        }
        .explorer-main .file-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .weather-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px;
        }
        .weather-display .temp {
            font-size: 48px;
            font-weight: 200;
        }
        .weather-display .desc {
            font-size: 20px;
            color: #aaa;
        }
        .sysinfo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .sysinfo-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 14px;
        }
        .sysinfo-card .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
        .sysinfo-card .value {
            font-size: 18px;
            font-weight: 500;
            margin-top: 4px;
        }
        .toast-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
        }
        .toast {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
        }
        .toast .toast-title {
            font-weight: 600;
            color: #fff;
        }
        .toast .toast-msg {
            color: #aaa;
            font-size: 13px;
        }
        @keyframes slideIn {
            from {
                transform: translateX(40px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .recycle-bin-icon {
            font-size: 42px;
            line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .custom-app-form {
            background: rgba(0, 0, 0, 0.5);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: auto;
            width: 100%;
        }
        .custom-app-form input,
        .custom-app-form select,
        .custom-app-form textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px 16px;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }
        .custom-app-form textarea {
            border-radius: 12px;
            min-height: 80px;
            resize: vertical;
            font-family: monospace;
        }
        .custom-app-form input:focus,
        .custom-app-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .custom-app-form button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
        }
        .custom-app-form button:hover {
            background: #8a7aff;
        }
        .custom-app-form .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .custom-app-form .row * {
            flex: 1;
        }

        @media (max-width: 640px) {
            #start-menu {
                width: calc(100% - 32px);
                left: 16px;
            }
            .os-window {
                width: 92% !important;
                left: 4% !important;
                min-width: unset;
            }
            .settings-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- DESKTOP -->
    <div id="desktop"></div>

    <!-- CONTEXT MENU -->
    <div id="context-menu">
        <button class="menu-item" data-action="open">▶ Open</button>
        <button class="menu-item" data-action="blank">📂 Open in about:blank</button>
        <div class="menu-divider"></div>
        <button class="menu-item" data-action="edit">✏️ Edit</button>
        <button class="menu-item danger" data-action="delete">🗑️ Delete</button>
        <div class="menu-divider"></div>
        <button class="menu-item" data-action="add">➕ Add new app</button>
    </div>

    <!-- START MENU -->
    <div id="start-menu"></div>

    <!-- TASKBAR -->
    <div id="taskbar">
        <button class="start-btn" id="startBtn">✦ Start</button>
        <div class="task-items" id="taskItems"></div>
        <div class="right">
            <span id="clock">00:00:00</span>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (() => {
            'use strict';

            // ---------- BUILT-IN APPS (internal) ----------
            const BUILTIN_APPS = [
                { id: 'calc', name: 'Calculator', icon: '🧮', type: 'internal', internal: 'calculator' },
                { id: 'notepad', name: 'Notepad', icon: '📝', type: 'internal', internal: 'notepad' },
                { id: 'settings', name: 'Settings', icon: '⚙️', type: 'internal', internal: 'settings' },
                { id: 'proxy', name: 'Web Proxy', icon: '🌐', type: 'internal', internal: 'proxy' },
                { id: 'terminal', name: 'Terminal', icon: '⌨️', type: 'internal', internal: 'terminal' },
                { id: 'music', name: 'Music Player', icon: '🎵', type: 'internal', internal: 'music' },
                { id: 'appstore', name: 'App Store', icon: '📦', type: 'internal', internal: 'appstore' },
                { id: 'explorer', name: 'File Explorer', icon: '📁', type: 'internal', internal: 'explorer' },
                { id: 'weather', name: 'Weather', icon: '🌤️', type: 'internal', internal: 'weather' },
                { id: 'sysinfo', name: 'System Info', icon: '💻', type: 'internal', internal: 'sysinfo' },
                { id: 'aetherflix', name: 'AetherFlix', icon: '🎬', type: 'internal', internal: 'aetherflix' },
                { id: 'blooket', name: 'Blooket (Hacks)', icon: '📚', type: 'internal', internal: 'blooket' },
                { id: 'kahoot', name: 'Kahoot (Hacks)', icon: '🎯', type: 'internal', internal: 'kahoot' },
                { id: 'gimkit', name: 'Gimkit (Hacks)', icon: '⚡', type: 'internal', internal: 'gimkit' },
                { id: 'roblox', name: 'Roblox (now.gg)', icon: '🎮', type: 'internal', internal: 'roblox' },
                { id: 'xcloud', name: 'Xbox Cloud Gaming', icon: '🟢', type: 'internal', internal: 'xcloud' }
            ];

            // ---------- STATE ----------
            let allApps = [];
            let appOrder = [];
            let openWindows = [];
            let zCounter = 100;
            let wallpaperData = null;
            let accentColor = '#7c6cf0';
            let recycleBin = [];
            let contextTargetId = null; // for right-click

            // ---------- DOM REFS ----------
            const desktop = document.getElementById('desktop');
            const startMenu = document.getElementById('start-menu');
            const startBtn = document.getElementById('startBtn');
            const taskItems = document.getElementById('taskItems');
            const clockEl = document.getElementById('clock');
            const toastContainer = document.getElementById('toastContainer');
            const contextMenu = document.getElementById('context-menu');

            // ---------- STORAGE KEYS ----------
            const STORAGE_ORDER = 'aether_order';
            const STORAGE_WALL = 'aether_wall';
            const STORAGE_NOTEPAD = 'aether_notepad';
            const STORAGE_ACCENT = 'aether_accent';
            const STORAGE_CUSTOM = 'aether_custom_apps';
            const STORAGE_RECYCLE = 'aether_recycle_bin';

            // ---------- LOAD / SAVE ----------
            function loadAllApps() {
                let base = BUILTIN_APPS.slice();
                const customData = localStorage.getItem(STORAGE_CUSTOM);
                if (customData) {
                    try {
                        const custom = JSON.parse(customData);
                        if (Array.isArray(custom)) base = base.concat(custom);
                    } catch (_) {}
                }
                const recycleData = localStorage.getItem(STORAGE_RECYCLE);
                if (recycleData) {
                    try {
                        const r = JSON.parse(recycleData);
                        if (Array.isArray(r)) recycleBin = r;
                    } catch (_) {}
                }
                allApps = base;
                const savedOrder = localStorage.getItem(STORAGE_ORDER);
                if (savedOrder) {
                    try {
                        const parsed = JSON.parse(savedOrder);
                        if (Array.isArray(parsed) && parsed.length === allApps.length) {
                            appOrder = parsed;
                            return;
                        }
                    } catch (_) {}
                }
                appOrder = allApps.map(a => a.id);
                saveOrder();
            }

            function saveAllApps() {
                const customApps = allApps.filter(a => !BUILTIN_APPS.some(b => b.id === a.id));
                localStorage.setItem(STORAGE_CUSTOM, JSON.stringify(customApps));
                localStorage.setItem(STORAGE_RECYCLE, JSON.stringify(recycleBin));
                saveOrder();
            }

            function saveOrder() {
                localStorage.setItem(STORAGE_ORDER, JSON.stringify(appOrder));
            }

            function getAppById(id) {
                return allApps.find(a => a.id === id);
            }

            // ---------- EXTERNAL APP LOADER ----------
            async function loadExternalAppLinks(url) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!Array.isArray(data)) throw new Error('Not an array');
                    let added = 0;
                    data.forEach(app => {
                        if (!getAppById(app.id) && app.id && app.name) {
                            if (!app.type) app.type = 'external';
                            allApps.push(app);
                            appOrder.push(app.id);
                            added++;
                        }
                    });
                    if (added > 0) {
                        saveAllApps();
                        renderIcons();
                        buildStartMenu();
                        showToast('Apps Loaded', `Added ${added} apps from ${url}`);
                    } else {
                        showToast('Info', 'No new apps found.');
                    }
                } catch (err) {
                    showToast('Error', `Failed to load ${url}: ${err.message}`);
                }
            }

            // ---------- WALLPAPER ----------
            function loadWallpaper() {
                const w = localStorage.getItem(STORAGE_WALL);
                if (w) { wallpaperData = w;
                    applyWallpaper(w); }
            }

            function saveWallpaper() {
                if (wallpaperData) localStorage.setItem(STORAGE_WALL, wallpaperData);
                else localStorage.removeItem(STORAGE_WALL);
            }

            function applyWallpaper(data) {
                if (data) { desktop.style.backgroundImage = `url(${data})`;
                    desktop.style.backgroundColor = 'transparent'; } else { desktop.style.backgroundImage = 'none';
                    desktop.style.backgroundColor = 'var(--bg)'; }
            }

            // ---------- ACCENT ----------
            function loadAccent() {
                const a = localStorage.getItem(STORAGE_ACCENT);
                if (a) { accentColor = a;
                    document.documentElement.style.setProperty('--accent', a); }
            }

            function saveAccent(c) { localStorage.setItem(STORAGE_ACCENT, c); }

            // ---------- TOAST ----------
            function showToast(title, msg, duration = 3000) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${msg}</div>`;
                toastContainer.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300); }, duration);
            }

            // ---------- FAVICON ----------
            function getFaviconUrl(url) {
                try { const u = new URL(url); return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`; } catch (
                _) { return null; }
            }

            // ---------- CONTEXT MENU ----------
            function showContextMenu(e, appId) {
                e.preventDefault();
                contextTargetId = appId;
                const menu = contextMenu;
                menu.style.display = 'flex';
                let x = e.clientX,
                    y = e.clientY;
                // Keep inside viewport
                const rect = menu.getBoundingClientRect();
                if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 10;
                if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 10;
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
            }

            function hideContextMenu() {
                contextMenu.style.display = 'none';
                contextTargetId = null;
            }

            // Handle menu actions
            contextMenu.addEventListener('click', (e) => {
                const btn = e.target.closest('.menu-item');
                if (!btn) return;
                const action = btn.dataset.action;
                const id = contextTargetId;
                hideContextMenu();
                if (!id) return;
                const app = getAppById(id);
                if (!app) return;

                switch (action) {
                    case 'open':
                        openApp(id);
                        break;
                    case 'blank':
                        if (app.type === 'external') {
                            const blank = window.open('about:blank', '_blank');
                            if (blank) {
                                blank.document.write(`
                                    <html><head><title>${app.name}</title>
                                    <style>body { margin:0; overflow:hidden; } iframe { width:100%; height:100%; border:none; }</style>
                                    </head><body>
                                    <iframe src="${app.url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" allowfullscreen></iframe>
                                    </body></html>
                                `);
                                blank.document.close();
                                showToast('Opened', `${app.name} in about:blank`);
                            } else {
                                showToast('Popup Blocked', 'Allow popups for this site');
                            }
                        } else {
                            showToast('Info', 'Internal apps cannot be opened in about:blank');
                        }
                        break;
                    case 'edit':
                        openEditApp(id);
                        break;
                    case 'delete':
                        if (confirm(`Move "${app.name}" to Recycle Bin?`)) {
                            deleteApp(id);
                        }
                        break;
                    case 'add':
                        openCustomAppCreator();
                        break;
                    default:
                        break;
                }
            });

            // Close context menu on click outside
            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) hideContextMenu();
            });
            document.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('.app-icon')) hideContextMenu();
            });

            // ---------- EDIT APP WINDOW ----------
            function openEditApp(id) {
                const app = getAppById(id);
                if (!app) return;
                const win = document.createElement('div');
                win.className = 'os-window';
                win.style.zIndex = ++zCounter;
                win.style.width = '420px';
                win.style.height = '280px';
                win.style.left = '150px';
                win.style.top = '100px';

                const titleBar = document.createElement('div');
                titleBar.className = 'title-bar';
                titleBar.innerHTML = `
                    <div class="win-title">✏️ Edit ${app.name}</div>
                    <div class="win-controls"><button class="close-btn">✕</button></div>
                `;
                win.appendChild(titleBar);

                const content = document.createElement('div');
                content.className = 'win-content';
                content.style.display = 'flex';
                content.style.alignItems = 'center';
                content.style.justifyContent = 'center';

                const form = document.createElement('div');
                form.className = 'custom-app-form';
                form.innerHTML = `
                    <input type="text" id="editName" value="${app.name}" placeholder="App Name">
                    <input type="text" id="editIcon" value="${app.icon || '📦'}" placeholder="Icon (emoji)">
                    <input type="text" id="editUrl" value="${app.url || ''}" placeholder="URL (external only)" ${app.type === 'internal' ? 'disabled' : ''}>
                    <button id="saveEditBtn">Save Changes</button>
                `;
                content.appendChild(form);
                win.appendChild(content);
                desktop.appendChild(win);

                // Close
                titleBar.querySelector('.close-btn').addEventListener('click', () => {
                    win.remove();
                    const idx = openWindows.findIndex(w => w.winElement === win);
                    if (idx !== -1) openWindows.splice(idx, 1);
                    updateTaskbar();
                });

                // Save
                form.querySelector('#saveEditBtn').addEventListener('click', () => {
                    const name = form.querySelector('#editName').value.trim();
                    const icon = form.querySelector('#editIcon').value.trim() || '📦';
                    const url = form.querySelector('#editUrl').value.trim();
                    if (!name) { showToast('Error', 'Name is required'); return; }
                    if (app.type === 'external' && !url) { showToast('Error', 'URL is required for external apps'); return; }
                    if (app.type === 'external') {
                        try { new URL(url); } catch (_) { showToast('Error', 'Invalid URL'); return; }
                    }
                    // Update app
                    app.name = name;
                    app.icon = icon;
                    if (app.type === 'external') app.url = url;
                    saveAllApps();
                    renderIcons();
                    buildStartMenu();
                    showToast('Updated', `${name} saved`);
                    win.remove();
                    const idx = openWindows.findIndex(w => w.winElement === win);
                    if (idx !== -1) openWindows.splice(idx, 1);
                    updateTaskbar();
                });

                // Drag
                let drag = false,
                    ox, oy;
                titleBar.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = e.clientX - rect.left;
                    oy = e.clientY - rect.top;
                    win.style.zIndex = ++zCounter;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    let left = e.clientX - ox,
                        top = e.clientY - oy;
                    left = Math.max(0, Math.min(left, window.innerWidth - 60));
                    top = Math.max(0, Math.min(top, window.innerHeight - 100));
                    win.style.left = left + 'px';
                    win.style.top = top + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false; });

                win.addEventListener('mousedown', () => { win.style.zIndex = ++zCounter;
                    updateTaskbar(); });

                const entry = { id: 'edit-' + id, winElement: win, appDef: { name: 'Edit App' }, minimized: false };
                openWindows.push(entry);
                updateTaskbar();
            }

            // ---------- DELETE & RECYCLE ----------
            function deleteApp(id) {
                const app = getAppById(id);
                if (!app) return;
                const idx = allApps.findIndex(a => a.id === id);
                if (idx !== -1) allApps.splice(idx, 1);
                const orderIdx = appOrder.indexOf(id);
                if (orderIdx !== -1) appOrder.splice(orderIdx, 1);
                recycleBin.push(app);
                saveAllApps();
                renderIcons();
                buildStartMenu();
                showToast('App Deleted', `${app.name} moved to Recycle Bin`);
            }

            function restoreFromRecycle(id) {
                const idx = recycleBin.findIndex(a => a.id === id);
                if (idx === -1) return;
                const app = recycleBin.splice(idx, 1)[0];
                allApps.push(app);
                appOrder.push(app.id);
                saveAllApps();
                renderIcons();
                buildStartMenu();
                showToast('Restored', `${app.name} restored from Recycle Bin`);
            }

            function emptyRecycleBin() {
                if (recycleBin.length === 0) { showToast('Recycle Bin', 'Already empty'); return; }
                recycleBin = [];
                saveAllApps();
                showToast('Recycle Bin', 'Emptied permanently');
            }

            function openRecycleBin() {
                const id = 'recycle-bin-window';
                const existing = openWindows.find(w => w.id === id);
                if (existing) { existing.winElement.style.zIndex = ++zCounter;
                    existing.winElement.focus(); return; }
                const win = document.createElement('div');
                win.className = 'os-window';
                win.style.zIndex = ++zCounter;
                win.style.width = '500px';
                win.style.height = '400px';
                win.style.left = '100px';
                win.style.top = '100px';
                const titleBar = document.createElement('div');
                titleBar.className = 'title-bar';
                titleBar.innerHTML = `
                    <div class="win-title">🗑️ Recycle Bin</div>
                    <div class="win-controls"><button class="close-btn">✕</button></div>
                `;
                win.appendChild(titleBar);
                const content = document.createElement('div');
                content.className = 'win-content';
                content.style.overflow = 'auto';
                content.style.padding = '16px';
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.style.gap = '8px';
                win.appendChild(content);
                desktop.appendChild(win);

                function refreshRecycleView() {
                    content.innerHTML = '';
                    if (recycleBin.length === 0) {
                        content.innerHTML = '<p style="color:#888;text-align:center;">Recycle Bin is empty.</p>';
                        return;
                    }
                    const list = document.createElement('div');
                    list.style.display = 'flex';
                    list.style.flexDirection = 'column';
                    list.style.gap = '6px';
                    recycleBin.forEach(app => {
                        const row = document.createElement('div');
                        row.style.display = 'flex';
                        row.style.alignItems = 'center';
                        row.style.justifyContent = 'space-between';
                        row.style.background = 'rgba(255,255,255,0.04)';
                        row.style.padding = '6px 12px';
                        row.style.borderRadius = '8px';
                        row.innerHTML = `
                            <span>${app.icon} ${app.name}</span>
                            <div>
                                <button class="restore-btn" style="background:#2a8a5a;border:none;color:#fff;padding:2px 12px;border-radius:20px;cursor:pointer;">Restore</button>
                                <button class="delete-perm-btn" style="background:#c42b2b;border:none;color:#fff;padding:2px 12px;border-radius:20px;cursor:pointer;">Delete Permanently</button>
                            </div>
                        `;
                        row.querySelector('.restore-btn').addEventListener('click', () => {
                            restoreFromRecycle(app.id);
                            refreshRecycleView();
                        });
                        row.querySelector('.delete-perm-btn').addEventListener('click', () => {
                            if (confirm(`Permanently delete "${app.name}"?`)) {
                                const idx = recycleBin.findIndex(a => a.id === app.id);
                                if (idx !== -1) {
                                    recycleBin.splice(idx, 1);
                                    saveAllApps();
                                    refreshRecycleView();
                                    renderIcons();
                                    buildStartMenu();
                                    showToast('Deleted', `${app.name} permanently removed`);
                                }
                            }
                        });
                        list.appendChild(row);
                    });
                    const emptyBtn = document.createElement('button');
                    emptyBtn.textContent = 'Empty Recycle Bin';
                    emptyBtn.style.background = '#c42b2b';
                    emptyBtn.style.border = 'none';
                    emptyBtn.style.color = '#fff';
                    emptyBtn.style.padding = '6px 20px';
                    emptyBtn.style.borderRadius = '30px';
                    emptyBtn.style.cursor = 'pointer';
                    emptyBtn.style.marginTop = '12px';
                    emptyBtn.style.alignSelf = 'center';
                    emptyBtn.addEventListener('click', () => {
                        if (confirm('Empty Recycle Bin permanently?')) {
                            emptyRecycleBin();
                            refreshRecycleView();
                            renderIcons();
                            buildStartMenu();
                        }
                    });
                    content.appendChild(list);
                    content.appendChild(emptyBtn);
                }
                refreshRecycleView();
                titleBar.querySelector('.close-btn').addEventListener('click', () => {
                    win.remove();
                    const idx = openWindows.findIndex(w => w.id === id);
                    if (idx !== -1) openWindows.splice(idx, 1);
                });
                let drag = false,
                    ox, oy;
                titleBar.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = e.clientX - rect.left;
                    oy = e.clientY - rect.top;
                    win.style.zIndex = ++zCounter;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    let left = e.clientX - ox,
                        top = e.clientY - oy;
                    left = Math.max(0, Math.min(left, window.innerWidth - 60));
                    top = Math.max(0, Math.min(top, window.innerHeight - 100));
                    win.style.left = left + 'px';
                    win.style.top = top + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false; });
                win.addEventListener('mousedown', () => { win.style.zIndex = ++zCounter;
                    updateTaskbar(); });
                const entry = { id, winElement: win, appDef: { name: 'Recycle Bin', icon: '🗑️' }, minimized: false };
                openWindows.push(entry);
                updateTaskbar();
            }

            // ---------- RENDER ICONS ----------
            function renderIcons() {
                desktop.querySelectorAll('.app-icon:not(.recycle-icon)').forEach(el => el.remove());
                appOrder.forEach(id => {
                    const def = getAppById(id);
                    if (!def) return;
                    const icon = document.createElement('div');
                    icon.className = 'app-icon';
                    icon.draggable = true;
                    icon.dataset.id = id;
                    icon.addEventListener('contextmenu', (e) => showContextMenu(e, id));
                    const iconContent = def.type === 'internal' ?
                        `<span class="icon-emoji">${def.icon}</span>` :

            // ---------- DRAG & DROP ----------
            let dragId = null;

            function dragStart(e) {
                const el = e.currentTarget;
                dragId = el.dataset.id;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragId);
            }

            function dragEnd(e) { e.currentTarget.classList.remove('dragging');
                document.querySelectorAll('.app-icon.drag-over').forEach(el => el.classList.remove('drag-over')); }

            function dragOver(e) { e.preventDefault();
                e.dataTransfer.dropEffect = 'move'; const t = e.currentTarget; if (t.classList.contains('app-icon')) t
                    .classList.add('drag-over'); }

            function drop(e) {
                e.preventDefault();
                const target = e.currentTarget;
                target.classList.remove('drag-over');
                const srcId = e.dataTransfer.getData('text/plain');
                const tgtId = target.dataset.id;
                if (!srcId || !tgtId || srcId === tgtId) return;
                const srcIdx = appOrder.indexOf(srcId);
                const tgtIdx = appOrder.indexOf(tgtId);
                if (srcIdx === -1 || tgtIdx === -1) return;
                appOrder.splice(tgtIdx, 0, appOrder.splice(srcIdx, 1)[0]);
                saveOrder();
                renderIcons();
                showToast('Order Updated', `${getAppById(srcId).name} moved`);

            function renderCalculator(c) {
                c.innerHTML = `
                    <div class="calc-display" id="calcDisplay">0</div>
                    <div class="calc-grid">
                        <button class="clear" data-v="C">C</button><button data-v="±">±</button><button data-v="%">%</button><button class="op" data-v="/">÷</button>
                        <button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button class="op" data-v="*">×</button>
                        <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button class="op" data-v="-">−</button>
                        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button class="op" data-v="+">+</button>
                        <button data-v="0" style="grid-column:span 2;">0</button><button data-v=".">.</button><button class="eq" data-v="=">=</button>
                    </div>
                `;
                const display = c.querySelector('#calcDisplay');
                let expr = '';
                const update = () => { display.textContent = expr || '0'; };
                c.querySelectorAll('.calc-grid button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const v = btn.dataset.v;
                        if (v === 'C') { expr = '';
                            update(); return; }
                        if (v === '=') {
                            try { const result = Function('"use strict"; return (' + expr.replace(/×/g, '*').replace(/÷/g,
                                    '/') + ')')(); expr = String(result); } catch (_) { expr = 'Error'; }
                            update(); return;
                        }
                        if (v === '±') { if (expr.startsWith('-')) expr = expr.slice(1);
                            else if (expr && expr !== '0') expr = '-' + expr;
                            update(); return; }
                        if (v === '%') { try { const val = Function('"use strict"; return (' + expr.replace(/×/g, '*')

                            update(); return; }
                        expr += v;
                        update();
                    });
                });
            }

            function renderTerminal(c) {
                // Virtual file system
                const vfs = {
                    '/': { type: 'dir', children: { 'home': { type: 'dir', children: {} }, 'usr': { type: 'dir',
                                children: {} }, 'etc': { type: 'dir', children: {} }, 'tmp': { type: 'dir',
                                children: {} } } },
                    '/home': { type: 'dir', children: { 'user': { type: 'dir', children: {} } } },
                    '/home/user': { type: 'dir', children: { 'Desktop': { type: 'dir', children: {} },
                            'Documents': { type: 'dir', children: {} }, 'Downloads': { type: 'dir', children: {} } } }
                };
                let cwd = '/home/user';
                const user = 'user';
                const hostname = 'aether';

                function getNode(path) {
                    if (path === '/') return vfs['/'];
                    const parts = path.split('/').filter(Boolean);
                    let node = vfs['/'];
                    for (const part of parts) {
                        if (node.children && node.children[part]) {
                            node = node.children[part];
                        } else { return null; }
                    }
                    return node;
                }

                function resolvePath(path) {
                    if (path.startsWith('/')) return path;
                    if (path === '.') return cwd;
                    if (path === '..') {
                        const parts = cwd.split('/').filter(Boolean);
                        parts.pop();
                        return '/' + parts.join('/') || '/';
                    }
                    return cwd + (cwd.endsWith('/') ? '' : '/') + path;
                }

                c.innerHTML = `
                    <div class="terminal-lines" id="termLines">
                        <div><span class="prompt">${user}@${hostname}:~$</span> <span style="color:#8aff8a;">Welcome to AetherOS Terminal</span></div>
                        <div><span class="prompt">${user}@${hostname}:~$</span> <span style="color:#aaa;">Type 'help' for commands</span></div>
                    </div>
                    <div class="terminal-input-line">
                        <span class="prompt">$</span>
                        <input id="termInput" autofocus>
                    </div>
                `;
                const lines = c.querySelector('#termLines');
                const input = c.querySelector('#termInput');
                const history = [];
                let histIdx = 0;

                function getPrompt() {
                    const path = cwd === '/home/user' ? '~' : cwd.replace('/home/user', '~');
                    return `${user}@${hostname}:${path}$`;
                }

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value.trim();
                        if (!cmd) return;
                        lines.innerHTML += `<div><span class="prompt">${getPrompt()}</span> ${cmd}</div>`;
                        let output = '';
                        const parts = cmd.split(' ');
                        const main = parts[0].toLowerCase();
                        const args = parts.slice(1);

                        switch (main) {
                            case 'echo':
                                output = args.join(' ');
                                break;
                            case 'help':
                                output = 'Commands: echo, date, clear, help, whoami, ls, cd, pwd, mkdir, touch, rm, rmdir, uname';
                                break;
                            case 'date':
                                output = new Date().toString();
                                break;
                            case 'clear':
                                lines.innerHTML = '';
                                input.value = '';
                                return;
                            case 'whoami':
                                output = user;
                                break;
                            case 'uname':
                                output = 'AetherOS 2.0 (Ultimate)';
                                break;
                            case 'pwd':
                                output = cwd;
                                break;
                            case 'ls': {
                                const target = args[0] || '.';
                                const path = resolvePath(target);
                                const node = getNode(path);
                                if (!node) output = `ls: cannot access '${target}': No such file or directory`;
                                else if (node.type !== 'dir') output = `${target} is not a directory`;
                                else output = Object.keys(node.children).join('  ') || '(empty)';
                                break;
                            }
                            case 'cd': {
                                const target = args[0] || '/';
                                const path = resolvePath(target);
                                const node = getNode(path);
                                if (!node) output = `cd: no such file or directory: ${target}`;
                                else if (node.type !== 'dir') output = `cd: not a directory: ${target}`;
                                else cwd = path;
                                break;
                            }
                            case 'mkdir': {
                                const target = args[0];
                                if (!target) { output = 'mkdir: missing operand'; break; }
                                const path = resolvePath(target);
                                const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                                const name = path.substring(path.lastIndexOf('/') + 1);
                                const parent = getNode(parentPath);
                                if (!parent) { output =
                                        `mkdir: cannot create directory '${target}': No such file or directory`; break; }
                                if (parent.type !== 'dir') { output =
                                        `mkdir: cannot create directory '${target}': Not a directory`; break; }
                                if (parent.children[name]) { output =
                                        `mkdir: cannot create directory '${target}': File exists`; break; }
                                parent.children[name] = { type: 'dir', children: {} };
                                output = '';
                                break;
                            }
                            case 'touch': {
                                const target = args[0];
                                if (!target) { output = 'touch: missing operand'; break; }
                                const path = resolvePath(target);
                                const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                                const name = path.substring(path.lastIndexOf('/') + 1);
                                const parent = getNode(parentPath);
                                if (!parent) { output = `touch: cannot touch '${target}': No such file or directory`; break; }
                                if (parent.type !== 'dir') { output = `touch: cannot touch '${target}': Not a directory`; break; }
                                if (!parent.children[name]) parent.children[name] = { type: 'file', content: '' };
                                output = '';
                                break;
                            }
                            case 'rm': {
                                const target = args[0];
                                if (!target) { output = 'rm: missing operand'; break; }
                                const path = resolvePath(target);
                                const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                                const name = path.substring(path.lastIndexOf('/') + 1);
                                const parent = getNode(parentPath);
                                if (!parent) { output = `rm: cannot remove '${target}': No such file or directory`; break; }
                                if (parent.type !== 'dir') { output = `rm: cannot remove '${target}': Not a directory`; break; }
                                if (!parent.children[name]) { output =
                                        `rm: cannot remove '${target}': No such file or directory`; break; }
                                delete parent.children[name];
                                output = '';
                                break;
                            }
                            case 'rmdir': {
                                const target = args[0];
                                if (!target) { output = 'rmdir: missing operand'; break; }
                                const path = resolvePath(target);
                                const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                                const name = path.substring(path.lastIndexOf('/') + 1);
                                const parent = getNode(parentPath);
                                if (!parent) { output =
                                        `rmdir: failed to remove '${target}': No such file or directory`; break; }
                                if (parent.type !== 'dir') { output =
                                        `rmdir: failed to remove '${target}': Not a directory`; break; }
                                if (!parent.children[name]) { output =
                                        `rmdir: failed to remove '${target}': No such file or directory`; break; }
                                if (parent.children[name].type !== 'dir') { output =
                                        `rmdir: failed to remove '${target}': Not a directory`; break; }
                                if (Object.keys(parent.children[name].children).length > 0) { output =
                                        `rmdir: failed to remove '${target}': Directory not empty`; break; }
                                delete parent.children[name];
                                output = '';
                                break;
                            }
                            default:
                                output = `Command not found: ${cmd}`;
                        }
                        if (output) lines.innerHTML += `<div><span style="color:#aaa;">${output}</span></div>`;
                        lines.scrollTop = lines.scrollHeight;
                        input.value = '';
                        history.push(cmd);
                        histIdx = history.length;
                    } else if (e.key === 'ArrowUp') {
                        if (histIdx > 0) { histIdx--;
                            input.value = history[histIdx] || ''; }
                        e.preventDefault();
                    } else if (e.key === 'ArrowDown') {
                        if (histIdx < history.length - 1) { histIdx++;
                            input.value = history[histIdx] || ''; } else { histIdx = history.length;
                            input.value = ''; }
                        e.preventDefault();
                    }
                });
                c.addEventListener('click', () => input.focus());
            }
