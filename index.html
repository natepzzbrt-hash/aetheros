            // ---------- TERMINAL ----------
            function renderTerminal(c) {
                // Virtual file system
                const vfs = {
                    '/': { type: 'dir', children: {
                            'home': { type: 'dir', children: {} },
                            'usr': { type: 'dir', children: {} },
                            'etc': { type: 'dir', children: {} },
                            'tmp': { type: 'dir', children: {} },
                            'var': { type: 'dir', children: {} },
                            'bin': { type: 'dir', children: {} }
                        } },
                    '/home': { type: 'dir', children: { 'user': { type: 'dir', children: {} } } },
                    '/home/user': { type: 'dir', children: {
                            'Desktop': { type: 'dir', children: {} },
                            'Documents': { type: 'dir', children: {} },
                            'Downloads': { type: 'dir', children: {} },
                            'file1.txt': { type: 'file', content: 'Hello world' }
                        } }
                };
                let cwd = '/home/user';
                const user = 'user';
                const hostname = 'aether';
                let commandHistory = [];
                let histIdx = 0;

                function getNode(path) {
                    if (path === '/') return vfs['/'];
                    const parts = path.split('/').filter(Boolean);
                    let node = vfs['/'];
                    for (const part of parts) {
                        if (node.children && node.children[part]) {
                            node = node.children[part];
                        } else { return null; }
                    }
                    return node;
                }

                function resolvePath(path) {
                    if (path.startsWith('/')) return path;
                    if (path === '.') return cwd;
                    if (path === '..') {
                        const parts = cwd.split('/').filter(Boolean);
                        parts.pop();
                        return '/' + parts.join('/') || '/';
                    }
                    return cwd + (cwd.endsWith('/') ? '' : '/') + path;
                }

                function listDir(node) {
                    return Object.keys(node.children).join('  ') || '(empty)';
                }

                function getPrompt() {
                    const path = cwd === '/home/user' ? '~' : cwd.replace('/home/user', '~');
                    return `${user}@${hostname}:${path}$`;
                }

                c.innerHTML = `
                    <div class="terminal-lines" id="termLines">
                        <div><span class="prompt">${getPrompt()}</span> <span style="color:#8aff8a;">Welcome to AetherOS Terminal v2.0</span></div>
                        <div><span class="prompt">${getPrompt()}</span> <span style="color:#aaa;">Type 'help' for commands</span></div>
                    </div>
                    <div class="terminal-input-line">
                        <span class="prompt">$</span>
                        <input id="termInput" autofocus>
                    </div>
                `;
                const lines = c.querySelector('#termLines');
                const input = c.querySelector('#termInput');

                function executeCommand(cmd) {
                    if (!cmd) return;
                    const parts = cmd.split(' ');
                    const main = parts[0].toLowerCase();
                    const args = parts.slice(1);
                    let output = '';

                    switch (main) {
                        case 'echo':
                            output = args.join(' ');
                            break;
                        case 'help':
                            output = 'Commands: echo, date, clear, help, whoami, ls, cd, pwd, mkdir, touch, rm, rmdir, uname, cat, nano, cp, mv, grep, man, history, alias, export, source, which, uptime, who, users, w, df, free, ps, kill, reboot';
                            break;
                        case 'date':
                            output = new Date().toString();
                            break;
                        case 'clear':
                            lines.innerHTML = '';
                            return;
                        case 'whoami':
                            output = user;
                            break;
                        case 'uname':
                            output = 'AetherOS 2.0 (Ultimate)';
                            break;
                        case 'pwd':
                            output = cwd;
                            break;
                        case 'uptime':
                            output = 'up ' + Math.floor(Math.random() * 100) + ' days, ' + Math.floor(Math.random() * 24) +
                                ' hours';
                            break;
                        case 'who':
                        case 'users':
                            const profiles = getProfiles();
                            output = profiles.map(p => p.name).join(' ') || 'No users';
                            break;
                        case 'w':
                            output = '  USER   TTY   FROM   LOGIN@   IDLE   JCPU   PCPU   WHAT\n  ' + user +
                                '   tty1   :0     ' + new Date().toLocaleTimeString() + '   0.00s  0.02s  0.01s  bash';
                            break;
                        case 'df':
                            output = 'Filesystem   Size   Used   Avail   Use%\n/dev/sda1     100G   45G    55G     45%';
                            break;
                        case 'free':
                            output = '              total   used   free   shared   buff/cache   available\nMem:           16G     8.2G   3.1G   1.2G      4.7G         5.8G';
                            break;
                        case 'ps':
                            output = '  PID   TTY   TIME   CMD\n  1     ?     00:00  systemd\n  2     ?     00:00  kthreadd\n  3     ?     00:00  rcu_gp\n  123   pts/0  00:00  bash';
                            break;
                        case 'kill':
                            output = 'kill: send signal to process ' + (args[0] || '') + ' (dummy)';
                            break;
                        case 'reboot':
                            output = 'Rebooting... (dummy)';
                            break;
                        case 'history':
                            output = commandHistory.map((c, i) => `  ${i+1}  ${c}`).join('\n') || 'No commands';
                            break;
                        case 'alias':
                            output = 'alias ll="ls -l"   (dummy)';
                            break;
                        case 'export':
                            output = 'export PATH=/usr/local/bin:$PATH   (dummy)';
                            break;
                        case 'source':
                            output = 'source .bashrc   (dummy)';
                            break;
                        case 'which':
                            output = args[0] ? `/usr/bin/${args[0]}` : 'which: missing argument';
                            break;
                        case 'ls': {
                            const target = args[0] || '.';
                            const path = resolvePath(target);
                            const node = getNode(path);
                            if (!node) output = `ls: cannot access '${target}': No such file or directory`;
                            else if (node.type !== 'dir') output = `${target} is not a directory`;
                            else output = listDir(node);
                            break;
                        }
                        case 'cd': {
                            const target = args[0] || '/';
                            const path = resolvePath(target);
                            const node = getNode(path);
                            if (!node) output = `cd: no such file or directory: ${target}`;
                            else if (node.type !== 'dir') output = `cd: not a directory: ${target}`;
                            else cwd = path;
                            break;
                        }
                        case 'mkdir': {
                            const target = args[0];
                            if (!target) { output = 'mkdir: missing operand'; break; }
                            const path = resolvePath(target);
                            const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                            const name = path.substring(path.lastIndexOf('/') + 1);
                            const parent = getNode(parentPath);
                            if (!parent) { output =
                                    `mkdir: cannot create directory '${target}': No such file or directory`; break; }
                            if (parent.type !== 'dir') { output =
                                    `mkdir: cannot create directory '${target}': Not a directory`; break; }
                            if (parent.children[name]) { output =
                                    `mkdir: cannot create directory '${target}': File exists`; break; }
                            parent.children[name] = { type: 'dir', children: {} };
                            output = '';
                            break;
                        }
                        case 'touch': {
                            const target = args[0];
                            if (!target) { output = 'touch: missing operand'; break; }
                            const path = resolvePath(target);
                            const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                            const name = path.substring(path.lastIndexOf('/') + 1);
                            const parent = getNode(parentPath);
                            if (!parent) { output = `touch: cannot touch '${target}': No such file or directory`; break; }
                            if (parent.type !== 'dir') { output = `touch: cannot touch '${target}': Not a directory`; break; }
                            if (!parent.children[name]) parent.children[name] = { type: 'file', content: '' };
                            output = '';
                            break;
                        }
                        case 'rm': {
                            const target = args[0];
                            if (!target) { output = 'rm: missing operand'; break; }
                            const path = resolvePath(target);
                            const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                            const name = path.substring(path.lastIndexOf('/') + 1);
                            const parent = getNode(parentPath);
                            if (!parent) { output = `rm: cannot remove '${target}': No such file or directory`; break; }
                            if (parent.type !== 'dir') { output = `rm: cannot remove '${target}': Not a directory`; break; }
                            if (!parent.children[name]) { output =
                                    `rm: cannot remove '${target}': No such file or directory`; break; }
                            delete parent.children[name];
                            output = '';
                            break;
                        }
                        case 'rmdir': {
                            const target = args[0];
                            if (!target) { output = 'rmdir: missing operand'; break; }
                            const path = resolvePath(target);
                            const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                            const name = path.substring(path.lastIndexOf('/') + 1);
                            const parent = getNode(parentPath);
                            if (!parent) { output =
                                    `rmdir: failed to remove '${target}': No such file or directory`; break; }
                            if (parent.type !== 'dir') { output =
                                    `rmdir: failed to remove '${target}': Not a directory`; break; }
                            if (!parent.children[name]) { output =
                                    `rmdir: failed to remove '${target}': No such file or directory`; break; }
                            if (parent.children[name].type !== 'dir') { output =
                                    `rmdir: failed to remove '${target}': Not a directory`; break; }
                            if (Object.keys(parent.children[name].children).length > 0) { output =
                                    `rmdir: failed to remove '${target}': Directory not empty`; break; }
                            delete parent.children[name];
                            output = '';
                            break;
                        }
                        case 'cat': {
                            const target = args[0];
                            if (!target) { output = 'cat: missing operand'; break; }
                            const path = resolvePath(target);
                            const node = getNode(path);
                            if (!node) { output = `cat: ${target}: No such file or directory`; break; }
                            if (node.type !== 'file') { output = `cat: ${target}: Is a directory`; break; }
                            output = node.content || '(empty file)';
                            break;
                        }
                        case 'nano': {
                            const target = args[0];
                            if (!target) { output = 'nano: missing file'; break; }
                            const path = resolvePath(target);
                            const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                            const name = path.substring(path.lastIndexOf('/') + 1);
                            const parent = getNode(parentPath);
                            if (!parent) { output = `nano: cannot edit '${target}': No such file or directory`; break; }
                            if (parent.type !== 'dir') { output = `nano: cannot edit '${target}': Not a directory`; break; }
                            if (!parent.children[name]) {
                                parent.children[name] = { type: 'file', content: '' };
                            }
                            const node = parent.children[name];
                            const newContent = prompt('Edit content for ' + name + ':', node.content || '');
                            if (newContent !== null) {
                                node.content = newContent;
                                output = 'File saved';
                            } else {
                                output = 'Edit cancelled';
                            }
                            break;
                        }
                        case 'cp': {
                            const src = args[0],
                                dst = args[1];
                            if (!src || !dst) { output = 'cp: missing operands'; break; }
                            const srcPath = resolvePath(src);
                            const srcNode = getNode(srcPath);
                            if (!srcNode) { output = `cp: cannot stat '${src}': No such file or directory`; break; }
                            const dstPath = resolvePath(dst);
                            const dstParentPath = dstPath.substring(0, dstPath.lastIndexOf('/')) || '/';
                            const dstName = dstPath.substring(dstPath.lastIndexOf('/') + 1);
                            const dstParent = getNode(dstParentPath);
                            if (!dstParent) { output = `cp: cannot create '${dst}': No such file or directory`; break; }
                            if (dstParent.type !== 'dir') { output = `cp: cannot create '${dst}': Not a directory`; break; }
                            dstParent.children[dstName] = { ...srcNode };
                            if (srcNode.type === 'dir') dstParent.children[dstName].children = { ...srcNode.children };
                            output = '';
                            break;
                        }
                        case 'mv': {
                            const src = args[0],
                                dst = args[1];
                            if (!src || !dst) { output = 'mv: missing operands'; break; }
                            const srcPath = resolvePath(src);
                            const srcNode = getNode(srcPath);
                            if (!srcNode) { output = `mv: cannot stat '${src}': No such file or directory`; break; }
                            const dstPath = resolvePath(dst);
                            const dstParentPath = dstPath.substring(0, dstPath.lastIndexOf('/')) || '/';
                            const dstName = dstPath.substring(dstPath.lastIndexOf('/') + 1);
                            const dstParent = getNode(dstParentPath);
                            if (!dstParent) { output = `mv: cannot move '${dst}': No such file or directory`; break; }
                            if (dstParent.type !== 'dir') { output = `mv: cannot move '${dst}': Not a directory`; break; }
                            const srcParentPath = srcPath.substring(0, srcPath.lastIndexOf('/')) || '/';
                            const srcName = srcPath.substring(srcPath.lastIndexOf('/') + 1);
                            const srcParent = getNode(srcParentPath);
                            if (srcParent) delete srcParent.children[srcName];
                            dstParent.children[dstName] = srcNode;
                            output = '';
                            break;
                        }
                        case 'grep': {
                            const pattern = args[0],
                                file = args[1];
                            if (!pattern || !file) { output = 'grep: missing pattern or file'; break; }
                            const path = resolvePath(file);
                            const node = getNode(path);
                            if (!node) { output = `grep: ${file}: No such file or directory`; break; }
                            if (node.type !== 'file') { output = `grep: ${file}: Is a directory`; break; }
                            const lines2 = node.content.split('\n');
                            const matches = lines2.filter(l => l.includes(pattern));
                            output = matches.join('\n') || '(no matches)';
                            break;
                        }
                        case 'man': {
                            const topic = args[0];
                            if (!topic) { output = 'man: missing argument'; break; }
                            const manual = {
                                echo: 'echo - display a line of text',
                                ls: 'ls - list directory contents',
                                cd: 'cd - change the current directory',
                                pwd: 'pwd - print working directory',
                                cat: 'cat - concatenate files and print',
                                nano: 'nano - simple text editor',
                                cp: 'cp - copy files/directories',
                                mv: 'mv - move/rename files/directories',
                                rm: 'rm - remove files/directories',
                                mkdir: 'mkdir - create directories',
                                grep: 'grep - print lines matching a pattern',
                                help: 'help - display this help'
                            };
                            output = manual[topic] || `No manual entry for ${topic}`;
                            break;
                        }
                        default:
                            output = `Command not found: ${cmd}`;
                    }
                    if (output) {
                        lines.innerHTML += `<div><span style="color:#aaa;">${output}</span></div>`;
                    }
                    lines.scrollTop = lines.scrollHeight;
                    commandHistory.push(cmd);
                    histIdx = commandHistory.length;
                }

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value.trim();
                        if (!cmd) return;
                        lines.innerHTML += `<div><span class="prompt">${getPrompt()}</span> ${cmd}</div>`;
                        executeCommand(cmd);
                        input.value = '';
                    } else if (e.key === 'ArrowUp') {
                        if (histIdx > 0) { histIdx--;
                            input.value = commandHistory[histIdx] || ''; }
                        e.preventDefault();
                    } else if (e.key === 'ArrowDown') {
                        if (histIdx < commandHistory.length - 1) { histIdx++;
                            input.value = commandHistory[histIdx] || ''; } else { histIdx = commandHistory.length;
                            input.value = ''; }
                        e.preventDefault();
                    }
                });
                c.addEventListener('click', () => input.focus());
            }

            // ---------- MESSAGES (fixed with real-time sync) ----------
            function renderMessages(c) {
                const user = getCurrentUser();
                if (!user) {
                    c.innerHTML =
                        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;flex-direction:column;gap:8px;"><p>Please create a profile first.</p><button onclick="openProfileCreator()" style="background:var(--accent);border:none;color:#fff;padding:8px 20px;border-radius:30px;cursor:pointer;">Create Profile</button></div>`;
                    return;
                }

                let messages = getMessages();
                const friends = getFriends();

                // BroadcastChannel for real-time sync across tabs
                if (!window.bc) {
                    window.bc = new BroadcastChannel('aether_chat');
                }
                // Always set the onmessage handler
                window.bc.onmessage = (e) => {
                    if (e.data.type === 'newMessage') {
                        messages = e.data.messages;
                        saveMessages(messages);
                        renderChat();
                    }
                };

                // Also listen for storage events (fallback for cross-tab sync)
                const storageHandler = (e) => {
                    if (e.key === STORAGE_MESSAGES || e.key === STORAGE_MESSAGES + '_trigger') {
                        messages = getMessages();
                        renderChat();
                    }
                };
                window.addEventListener('storage', storageHandler);

                function renderChat() {
                    const container = document.createElement('div');
                    container.className = 'messages-container';

                    const sidebar = document.createElement('div');
                    sidebar.className = 'messages-sidebar';
                    sidebar.innerHTML = `
                        <div class="profile-card">
                            <div class="avatar">${user.avatar}</div>
                            <div class="name">${user.name}</div>
                            <div class="status">${user.status}</div>
                        </div>
                        <div class="friend-list-title">Friends</div>
                        <div class="friend-list">
                            ${friends.map(f => `<div class="friend-item"><span class="${f.status === 'Online' ? 'online' : 'offline'}">●</span> ${f.name}</div>`).join('')}
                            ${friends.length === 0 ? '<div style="color:#888;font-size:12px;padding:4px 6px;">No friends yet. Type /add username in chat.</div>' : ''}
                        </div>
                    `;
                    container.appendChild(sidebar);

                    const chatArea = document.createElement('div');
                    chatArea.className = 'messages-chat-area';

                    const chatMessages = document.createElement('div');
                    chatMessages.className = 'messages-chat';
                    const sortedMessages = [...messages].reverse();
                    if (sortedMessages.length === 0) {
                        chatMessages.innerHTML =
                            '<div style="color:#888;text-align:center;padding:20px;">No messages yet. Say hello!</div>';
                    } else {
                        sortedMessages.forEach(msg => {
                            const div = document.createElement('div');
                            div.className = 'msg';
                            const sender = msg.sender;
                            const profile = getProfiles().find(p => p.name === sender);
                            const avatar = profile ? profile.avatar : '👤';
                            div.innerHTML = `
                                <span>${avatar}</span>
                                <span class="sender">${sender}</span>
                                <span class="content">${msg.content}</span>
                                <span class="time">${new Date(msg.timestamp).toLocaleTimeString()}</span>
                            `;
                            chatMessages.appendChild(div);
                        });
                    }
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    chatArea.appendChild(chatMessages);

                    const inputArea = document.createElement('div');
                    inputArea.className = 'messages-input';
                    inputArea.innerHTML = `
                        <input id="msgInput" placeholder="Type a message... ( /add username to add friend )">
                        <button id="sendBtn">Send</button>
                    `;
                    inputArea.querySelector('#sendBtn').addEventListener('click', () => {
                        const input = inputArea.querySelector('#msgInput');
                        const text = input.value.trim();
                        if (!text) return;
                        if (text.startsWith('/add ')) {
                            const friendName = text.substring(5).trim();
                            if (friendName) addFriend(friendName);
                            input.value = '';
                            // Refresh friends list
                            friends.length = 0;
                            friends.push(...getFriends());
                            renderChat();
                            return;
                        }
                        sendMessage(text);
                        input.value = '';
                        // Immediately update local messages and re-render
                        messages = getMessages();
                        renderChat();
                    });
                    inputArea.querySelector('#msgInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            inputArea.querySelector('#sendBtn').click();
                        }
                    });
                    chatArea.appendChild(inputArea);
                    container.appendChild(chatArea);

                    c.innerHTML = '';
                    c.appendChild(container);
                    const chatEl = c.querySelector('.messages-chat');
                    if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
                }

                renderChat();

                // Clean up storage listener when window is closed (optional)
                // We'll keep it for this session.
            }
